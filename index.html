<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>电工四级理论题库</title>
<style>
:root{--bg:#f7f9fc;--bg-top:#eef3fb;--card:#fff;--card-2:#fafbfe;--text:#0f172a;--text-2:#334155;--text-3:#64748b;--text-4:#94a3b8;--border:#e8edf5;--border-2:#dde5f0;--brand:#3b82f6;--brand-dark:#1d4ed8;--brand-soft:#eef4ff;--brand-grad:linear-gradient(135deg,#4f8cf8,#6366f1);--success:#16a34a;--success-soft:#f0fdf4;--success-bg:#dcfce7;--danger:#dc2626;--danger-soft:#fef2f2;--danger-bg:#fee2e2;--warning:#d97706;--warning-soft:#fff7ed;--purple:#7c3aed;--purple-soft:#f5f3ff;--star:#f59e0b;--shadow:0 1px 3px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.05);--shadow-sm:0 1px 2px rgba(15,23,42,.04);--r:10px;--r-md:14px;--r-lg:18px}
body.dark{--bg:#0a1020;--bg-top:#0f1729;--card:#1a2540;--card-2:#213052;--text:#e6edf7;--text-2:#b8c5da;--text-3:#8899b3;--text-4:#5c6d88;--border:#2a3a5c;--border-2:#334a73;--brand:#60a5fa;--brand-dark:#93c5fd;--brand-soft:#1e3a5f;--success:#4ade80;--success-soft:#052e16;--success-bg:#0f3a1f;--danger:#f87171;--danger-soft:#3f0a0a;--danger-bg:#5a1414;--warning:#fbbf24;--warning-soft:#422006;--purple:#c4b5fd;--purple-soft:#2e1065;--star:#fbbf24;--shadow:0 1px 3px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg) 200px,var(--bg) 100%);color:var(--text);min-height:100vh;min-height:100dvh;transition:background .25s,color .25s;-webkit-text-size-adjust:100%;line-height:1.5;font-size:15px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit;outline:none}
a{color:inherit;text-decoration:none}
.wrap{max-width:780px;margin:0 auto;padding:12px 12px 100px;padding-left:calc(12px + env(safe-area-inset-left));padding-right:calc(12px + env(safe-area-inset-right));padding-top:calc(12px + env(safe-area-inset-top))}
@media (min-width:768px){.wrap{max-width:820px;padding:18px 18px 110px}}
@media (min-width:1100px){.wrap{max-width:880px;padding:24px 20px 120px}}
.topbar{margin-bottom:10px}
.topbar-mini{display:none}
.topbar.collapsed .topbar-full{display:none}
.topbar.collapsed .topbar-mini{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 14px;cursor:pointer;box-shadow:var(--shadow-sm);font-size:13px;color:var(--text-2);transition:.15s}
.topbar.collapsed .topbar-mini:active{transform:scale(.995)}
.mini-icon{font-size:15px;flex:0 0 auto}
.mini-mode{font-weight:700;color:var(--brand-dark);flex:0 0 auto;font-size:13px}
.mini-prog{color:var(--text-3);flex:0 0 auto;font-size:12.5px}
.mini-rate{color:var(--text-4);flex:1;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.mini-expand{color:var(--brand);font-weight:700;flex:0 0 auto;font-size:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 2px 12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{width:36px;height:36px;border-radius:11px;background:var(--brand-grad);display:grid;place-items:center;font-size:18px;flex:0 0 auto;box-shadow:0 4px 12px rgba(79,140,248,.3)}
h1{font-size:16px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);font-weight:700}
.head-btns{display:flex;gap:6px;flex:0 0 auto}
.icon-btn{width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--border);display:grid;place-items:center;font-size:15px;color:var(--text-3);transition:.15s;position:relative}
.icon-btn:active{transform:scale(.94)}
.icon-btn:hover{border-color:var(--border-2);color:var(--brand)}
.modes{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.modes::-webkit-scrollbar{display:none}
.modes button{flex:0 0 auto;padding:7px 14px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--text-3);font-size:13px;font-weight:500;transition:.18s;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.modes button.active{background:var(--brand-grad);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(79,140,248,.28)}
.badge{display:inline-block;min-width:16px;padding:0 5px;border-radius:8px;background:rgba(255,255,255,.25);font-size:10.5px;line-height:16px;text-align:center;font-weight:700}
.modes button:not(.active) .badge{background:#ef4444;color:#fff}
.modes button:not(.active) .badge.fav-badge{background:var(--star);color:#fff}
.statsbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:var(--card);border-radius:var(--r);padding:8px 4px;text-align:center;border:1px solid var(--border)}
.stat b{display:block;font-size:16px;line-height:1.3;font-weight:700}
.stat span{font-size:11px;color:var(--text-4)}
.stat.ok b{color:var(--success)}
.stat.bad b{color:var(--danger)}
.progress{height:4px;border-radius:99px;background:var(--border);overflow:hidden;margin-bottom:12px}
.progress i{display:block;height:100%;width:0;border-radius:99px;background:var(--brand-grad);transition:width .3s}
.resume-bar{display:none;align-items:center;gap:10px;margin-bottom:10px;padding:10px 14px;border-radius:var(--r-md);background:var(--warning-soft);border:1px solid rgba(217,119,6,.2);color:var(--warning);font-size:12.5px;line-height:1.4}
.resume-bar.show{display:flex}
.resume-bar .rb-icon{font-size:16px;flex:0 0 auto}
.resume-bar .rb-text{flex:1;min-width:0}
.resume-bar .rb-text b{font-weight:800}
.resume-bar .rb-btn{flex:0 0 auto;padding:5px 12px;border-radius:8px;background:var(--warning);color:#fff;font-size:12px;font-weight:700}
.resume-bar .rb-close{flex:0 0 auto;width:22px;height:22px;border-radius:50%;color:var(--warning);font-size:14px;display:grid;place-items:center}
.exam-bar{display:none;align-items:center;gap:12px;margin-bottom:10px;padding:10px 14px;border-radius:var(--r-md);background:linear-gradient(135deg,#fef3c7,#fde68a);border:1px solid #fbbf24;color:#78350f;font-size:13px;box-shadow:0 4px 14px rgba(251,191,36,.15)}
.exam-bar.show{display:flex}
.exam-bar .exam-timer{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;flex:0 0 auto;letter-spacing:.5px}
.exam-bar .exam-timer.warn{color:#dc2626;animation:pulseRed 1s infinite}
@keyframes pulseRed{0%,100%{opacity:1}50%{opacity:.55}}
.exam-bar .exam-info{flex:1;min-width:0;font-size:12.5px;opacity:.85}
.exam-bar .exam-submit{flex:0 0 auto;padding:6px 14px;border-radius:8px;background:#b45309;color:#fff;font-size:12.5px;font-weight:700}
body.dark .exam-bar{background:linear-gradient(135deg,#422006,#78350f);border-color:#b45309;color:#fef3c7}
body.dark .exam-bar .exam-submit{background:#fbbf24;color:#422006}
.card{background:var(--card);border-radius:var(--r-lg);padding:18px 16px;box-shadow:var(--shadow);border:1px solid var(--border);min-height:220px;position:relative;touch-action:pan-y}
@media (min-width:768px){.card{padding:22px 22px}}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.qhead-left{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.qhead-right{display:flex;gap:6px;align-items:center}
.tag{font-size:11.5px;padding:3px 10px;border-radius:7px;font-weight:600;background:var(--brand-soft);color:var(--brand-dark)}
.tag.judge{background:var(--warning-soft);color:var(--warning)}
.tag.shuffled{background:var(--purple-soft);color:var(--purple)}
.tag.exam{background:#fee2e2;color:#b91c1c}
.qno{font-size:11.5px;color:var(--text-4)}
.star-btn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:16px;color:var(--text-4);transition:.15s;border:1px solid transparent}
.star-btn:hover{background:var(--card-2);color:var(--star)}
.star-btn.active{color:var(--star)}
.star-btn:active{transform:scale(.9)}
.star-btn.pop{animation:starPop .4s ease}
@keyframes starPop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.qtext{font-size:16px;line-height:1.7;font-weight:600;margin-bottom:16px;color:var(--text);word-wrap:break-word;overflow-wrap:break-word}
@media (min-width:768px){.qtext{font-size:17px}}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:12px 14px;border-radius:var(--r);border:1.5px solid var(--border);background:var(--card-2);font-size:14.5px;line-height:1.5;color:var(--text-2);transition:.15s;word-wrap:break-word;overflow-wrap:break-word;position:relative}
.opt:hover{border-color:var(--brand);background:var(--brand-soft)}
.opt:active{transform:scale(.995)}
.opt .letter{flex:0 0 24px;height:24px;border-radius:7px;background:var(--brand-soft);color:var(--brand-dark);display:grid;place-items:center;font-size:12.5px;font-weight:700}
.opt.right{border-color:var(--success);background:var(--success-soft)}
.opt.right .letter{background:var(--success);color:#fff}
.opt.right::after{content:'✓';position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:16px;font-weight:900;color:var(--success);animation:iconIn .35s ease}
.opt.wrong{border-color:var(--danger);background:var(--danger-soft)}
.opt.wrong .letter{background:var(--danger);color:#fff}
.opt.wrong::after{content:'✗';position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:16px;font-weight:900;color:var(--danger);animation:iconIn .35s ease}
.opt.selected{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 3px rgba(79,140,248,.15)}
.opt.selected .letter{background:var(--brand);color:#fff}
.opt.locked{cursor:default}
@keyframes iconIn{from{opacity:0;transform:translateY(-50%) scale(.5)}to{opacity:1;transform:translateY(-50%) scale(1)}}
@keyframes tapPop{0%{transform:scale(1)}50%{transform:scale(.97)}100%{transform:scale(1)}}
.opt.tapped{animation:tapPop .22s ease}
.feedback{margin-top:14px;font-size:13.5px;min-height:22px;line-height:1.6}
.feedback.ok{color:var(--success)}
.feedback.bad{color:var(--danger)}
.fb-line{margin-bottom:2px}
.hint{color:var(--text-4);font-size:12.5px}
.exam-hint{color:var(--brand-dark);font-size:12.5px;font-weight:600;padding:8px 12px;background:var(--brand-soft);border-radius:9px;display:inline-block;margin-top:6px}
.confirm-btn{display:inline-flex;align-items:center;justify-content:center;margin-left:14px;padding:8px 26px;border-radius:9px;background:var(--brand-grad);color:#fff;font-size:14px;font-weight:600;box-shadow:0 4px 12px rgba(79,140,248,.28);transition:.15s;vertical-align:middle}
.confirm-btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 16px rgba(79,140,248,.36)}
.confirm-btn:active:not(:disabled){transform:scale(.97)}
.confirm-btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
@media (max-width:520px){.confirm-btn{margin-left:8px;padding:7px 20px;font-size:13.5px}}
.explain{margin-top:12px;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--border);background:var(--card);animation:fadeIn .25s ease}
.explain.ok{border-color:rgba(22,163,74,.3)}
.explain.bad{border-color:rgba(220,38,38,.3)}
@keyframes fadeIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.exp-head{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--brand-soft);border-bottom:1px solid var(--border)}
.explain.ok .exp-head{background:var(--success-soft)}
.explain.bad .exp-head{background:var(--danger-soft)}
.exp-head-icon{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12.5px;flex:0 0 auto;background:var(--brand);color:#fff}
.explain.ok .exp-head-icon{background:var(--success)}
.explain.bad .exp-head-icon{background:var(--danger)}
.exp-head-title{font-size:13px;font-weight:700;color:var(--brand-dark)}
.explain.ok .exp-head-title{color:var(--success)}
.explain.bad .exp-head-title{color:var(--danger)}
.exp-head-status{margin-left:auto;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--card);color:var(--text-3)}
.exp-body{padding:12px 14px 14px}
.exp-block{margin-bottom:12px}
.exp-block:last-child{margin-bottom:0}
.exp-label{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--brand-dark);margin-bottom:6px;padding:2px 8px;border-radius:5px;background:var(--brand-soft)}
.exp-label::before{content:'';width:3px;height:10px;border-radius:2px;background:var(--brand)}
.explain.ok .exp-label{color:var(--success);background:var(--success-soft)}
.explain.ok .exp-label::before{background:var(--success)}
.explain.bad .exp-label{color:var(--danger);background:var(--danger-soft)}
.explain.bad .exp-label::before{background:var(--danger)}
.exp-block p{margin:0;font-size:13px;line-height:1.75;color:var(--text-3);word-wrap:break-word;overflow-wrap:break-word}
.k-main{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}
.k-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:700;background:var(--purple-soft);color:var(--purple);transition:.15s;line-height:1.4;border:1px solid transparent;cursor:pointer}
.k-chip:hover{transform:translateY(-1px);border-color:var(--purple)}
.k-chip .k-icon{font-size:11px;opacity:.8}
.k-chip .k-plus{font-size:10px;font-weight:900;opacity:.55;margin-left:2px}
.k-sub{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:500;background:var(--card-2);color:var(--text-3);border:1px dashed var(--border-2);line-height:1.4}
.k-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.k-link{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--brand-soft);color:var(--brand-dark);transition:.15s;line-height:1.4}
.k-link:hover{transform:translateY(-1px)}
.k-link .k-arrow{font-size:10px;opacity:.6}
.exp-options{display:flex;flex-direction:column;gap:6px}
.exp-option{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:9px;background:var(--card-2);border-left:3px solid var(--border-2);font-size:12.5px;line-height:1.6}
.exp-option .opt-tag{flex:0 0 22px;height:22px;font-weight:800;font-size:12px;display:grid;place-items:center;border-radius:6px;background:var(--border);color:var(--text-3)}
.exp-option .opt-content{flex:1;min-width:0}
.exp-option .opt-text{font-weight:600;color:var(--text-2);margin-bottom:3px;word-wrap:break-word;overflow-wrap:break-word}
.exp-option .opt-analysis{color:var(--text-3);word-wrap:break-word;overflow-wrap:break-word}
.exp-option.is-right{background:var(--success-soft);border-left-color:var(--success)}
.exp-option.is-right .opt-tag{background:var(--success);color:#fff}
.exp-option.is-right .opt-text{color:var(--success)}
.exp-option.is-right .opt-analysis{color:var(--success)}
.exp-option.is-wrong{background:var(--danger-soft);border-left-color:var(--danger)}
.exp-option.is-wrong .opt-tag{background:var(--danger);color:#fff}
.exp-option.is-wrong .opt-text{color:var(--danger)}
.exp-option.is-wrong .opt-analysis{color:var(--danger)}
.sheet-toggle{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;padding:10px;width:100%;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);color:var(--text-3);font-size:12.5px;font-weight:600;transition:.15s}
.sheet-toggle:hover{border-color:var(--brand);color:var(--brand)}
.sheet-toggle .arrow{font-size:10px;transition:.2s}
.sheet-toggle.open .arrow{transform:rotate(180deg)}
.progress-ring{width:20px;height:20px;flex:0 0 auto;transform:rotate(-90deg)}
.progress-ring .ring-bg{stroke:var(--border)}
.progress-ring .ring-fg{stroke:var(--brand);transition:stroke-dashoffset .4s ease;stroke-linecap:round}
.sheet-toggle .ring-pct{font-size:11px;color:var(--text-4);font-variant-numeric:tabular-nums;min-width:34px;text-align:left}
.answer-sheet{max-height:0;overflow:hidden;transition:max-height .3s ease}
.answer-sheet.open{max-height:600px;margin-top:10px;overflow-y:auto}
.as-filters{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.as-filters button{padding:5px 12px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--text-3);font-size:12px;transition:.15s}
.as-filters button.active{background:var(--brand-grad);color:#fff;border-color:transparent}
.as-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px;padding:10px;background:var(--card);border-radius:var(--r-md);border:1px solid var(--border)}
.as-cell{aspect-ratio:1;min-width:0;border-radius:7px;border:1.5px solid var(--border);background:var(--card-2);color:var(--text-3);font-size:12px;font-weight:700;display:grid;place-items:center;transition:.12s;padding:0}
.as-cell:active{transform:scale(.9)}
.as-cell.right{background:var(--success-bg);border-color:var(--success);color:var(--success)}
.as-cell.wrong{background:var(--danger-bg);border-color:var(--danger);color:var(--danger)}
.as-cell.current{box-shadow:0 0 0 2.5px rgba(79,140,248,.3);border-color:var(--brand);color:var(--brand-dark)}
.as-cell.fav{position:relative}
.as-cell.fav::after{content:'★';position:absolute;top:-3px;right:-3px;font-size:9px;color:var(--star)}
.navbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;gap:6px;align-items:center;justify-content:center;z-index:50}
body.dark .navbar{background:rgba(10,16,32,.92)}
.nav-btn{flex:1;max-width:200px;padding:11px 8px;border-radius:var(--r);border:1px solid var(--border);background:var(--card);color:var(--text-2);font-size:14px;font-weight:500;transition:.15s}
.nav-btn:hover{border-color:var(--border-2)}
.nav-btn.primary{background:var(--brand-grad);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(79,140,248,.3);font-weight:600}
.nav-btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.jump{display:flex;gap:3px;align-items:center}
.jump input{width:64px;padding:10px 4px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text);text-align:center;font-size:13px}
.jump button{padding:10px 12px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text-3);font-size:12.5px}
.modal-overlay{position:fixed;inset:0;z-index:300;background:rgba(15,23,42,.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:var(--r-lg);max-width:420px;width:100%;max-height:85vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal-head h3{margin:0;font-size:15.5px;font-weight:700}
.modal-close{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--text-3);font-size:14px}
.modal-close:hover{background:var(--card-2)}
.modal-body{padding:16px;overflow-y:auto}
.form-row{margin-bottom:16px}
.form-row:last-child{margin-bottom:0}
.form-row>label{display:block;font-size:12.5px;font-weight:600;color:var(--text-3);margin-bottom:8px}
.btn-group{display:flex;flex-wrap:wrap;gap:6px}
.btn-group button{padding:8px 14px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text-3);font-size:13px;font-weight:500;transition:.15s}
.btn-group button:hover{border-color:var(--brand);color:var(--brand)}
.btn-group button.active{background:var(--brand-grad);color:#fff;border-color:transparent}
.modal-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.result-card{background:var(--card);border-radius:var(--r-lg);padding:24px 20px;border:1px solid var(--border);box-shadow:var(--shadow)}

<div class="wrap">
  <div class="topbar" id="topbar">

      <header>

          <button class="icon-btn" id="redoBtn" title="新练习" aria-label="新练习">✨</button>
          <button class="icon-btn" id="themeBtn" title="夜间模式" aria-label="夜间模式">🌙</button>
          <button class="icon-btn" id="collapseBtn" title="收起顶部" aria-label="收起顶部">▲</button>
        </div>
      </header>
      <div class="modes" id="modes">
        <button data-mode="all" class="active">全部练习</button>
        <button data-mode="single">单选题</button>
        <button data-mode="judge">判断题</button>
        <button data-mode="random">随机练习</button>
        <button data-mode="favorite" id="favModeBtn" style="display:none">收藏 <span class="badge fav-badge" id="favBadge">0</span></button>
        <button data-mode="wrong">错题重练 <span class="badge" id="wrongBadge">0</span></button>
        <button data-mode="topic" id="topicBtn" style="display:none">专题</button>
        <button data-mode="exam" id="examModeBtn">🎯 模拟考试</button>
      </div>
      <div class="statsbar">
        <div class="stat"><b id="statDone">0</b><span>已答</span></div>
        <div class="stat ok"><b id="statRight">0</b><span>正确</span></div>
        <div class="stat bad"><b id="statWrong">0</b><span>错误</span></div>
        <div class="stat"><b id="statRate">0%</b><span>正确率</span></div>
      </div>
      <div class="progress"><i id="progressBar"></i></div>
    </div>
    <div class="topbar-mini" id="topbarMini" title="点击展开顶部">
      <span class="mini-icon">⚡</span>
      <span class="mini-mode" id="miniMode">全部练习</span>

    </div>

    <button class="rb-close" id="resumeClose" aria-label="关闭">✕</button>
  </div>
  <div class="exam-bar" id="examBar">
    <span class="exam-timer" id="examTimer">60:00</span>
    <span class="exam-info" id="examInfo">0 / 50 已答</span>
    <button class="exam-submit" id="examSubmit">交卷</button>
  </div>
  <main id="card" class="card"></main>
  <button type="button" class="sheet-toggle" id="sheetToggle">
    <svg class="progress-ring" viewBox="0 0 20 20">
      <circle class="ring-bg" cx="10" cy="10" r="8" fill="none" stroke-width="2"/>
      <circle class="ring-fg" id="ringFg" cx="10" cy="10" r="8" fill="none" stroke-width="2" stroke-dasharray="50.265" stroke-dashoffset="50.265" transform="rotate(-90 10 10)"/>
    </svg>
    <span>📋 答题卡</span>
    <span class="ring-pct" id="ringPct">0%</span>
    <span class="arrow">▼</span>
  </button>

      <button data-filter="all" class="active">全部</button>
      <button data-filter="unanswered">未答</button>
      <button data-filter="wrong">错题</button>
      <button data-filter="right">正确</button>
      <button data-filter="fav">收藏</button>
    </div>
    <div class="as-grid" id="asGrid"></div>
  </div>
</div>

  <button class="nav-btn primary" id="nextBtn">下一题 →</button>

        </div>
      </div>
    </div>
    <div class="modal-foot">

    </div>
  </div>

function $(id){ return document.getElementById(id); }

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function shuffle(arr){
  for(var i = arr.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
function fmtTime(t){
  var d = new Date(t), p = function(n){ return String(n).padStart(2,'0'); };
  var now = new Date();
  var sameDay = d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
  if(sameDay) return '今天 ' + p(d.getHours()) + ':' + p(d.getMinutes());
  return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function fmtDuration(ms){
  var sec = Math.floor(ms / 1000);
  var m = Math.floor(sec / 60), s = sec % 60;
  return m + ' 分 ' + s + ' 秒';
}
function kbKeyword(k){
  if(!k) return '';
  var i = k.indexOf(' · ');
  return i > 0 ? k.slice(0, i).trim() : k.trim();
}
function kbSub(k){
  if(!k) return '';
  var i = k.indexOf(' · ');
  return i > 0 ? k.slice(i + 3).trim() : '';
}
function countByKeyword(kw){
  var n = 0;
  BANK.forEach(function(it){
    if(it.exp && it.exp.k && kbKeyword(it.exp.k) === kw) n++;
  });
  return n;
}
var toastTimer = null;
function showToast(msg, dur){
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, dur || 2400);
}
function animateNumber(el, from, to, dur, formatter){
  if(!el) return;
  if(el._anim) cancelAnimationFrame(el._anim);
  var start = performance.now();
  dur = dur || 400;
  function step(now){
    var t = Math.min(1, (now - start) / dur);
    var e = 1 - Math.pow(1 - t, 3);
    var val = from + (to - from) * e;
    el.textContent = formatter ? formatter(val) : Math.round(val);
    if(t < 1) el._anim = requestAnimationFrame(step);
    else el._anim = null;
  }
  el._anim = requestAnimationFrame(step);
}

/* ===== 选项打乱 ===== */
function makeShuffledOpts(item){
  if(item.type === 'judge') return {o:item.o.slice(), a:item.a, orig:[0,1]};
  var idxs = item.o.map(function(_, i){ return i; });
  for(var i = idxs.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = idxs[i]; idxs[i] = idxs[j]; idxs[j] = t;
  }
  return {
    o: idxs.map(function(i){ return item.o[i]; }),
    a: idxs.indexOf(item.a),
    orig: idxs
  };
}
function getView(item, session){
  if(session && session.optsMap && session.optsMap[item.no]) return session.optsMap[item.no];
  return {o:item.o, a:item.a, orig:null};
}
var OPTS_MAP_MAX = 300;
function ensureOptsForItem(session, item){
  if(session.mode !== 'random' && session.isExam !== true) return;
  if(!session.optsMap) session.optsMap = {};
  if(!session.optsMapOrder) session.optsMapOrder = [];
  if(!session.optsMap[item.no]){
    session.optsMap[item.no] = makeShuffledOpts(item);
    session.optsMapOrder.push(item.no);
    while(session.optsMapOrder.length > OPTS_MAP_MAX){
      var oldNo = session.optsMapOrder.shift();
      delete session.optsMap[oldNo];
    }
    saveSessions();
  }
}

/* ===== 字母重映射 ===== */
function remapExpText(text, item, session){
  if(!text || !item) return text;
  if(item.type === 'judge') return text;
  if(!session || (session.mode !== 'random' && session.isExam !== true)) return text;
  if(!session.optsMap || !session.optsMap[item.no]) return text;
  var view = getView(item, session);
  var letterMap = {};
  for(var i = 0; i < item.o.length; i++){
    var content = item.o[i];
    var newIdx = -1;
    for(var j = 0; j < view.o.length; j++){
      if(view.o[j] === content){ newIdx = j; break; }
    }
    letterMap['ABCD'[i]] = newIdx >= 0 ? 'ABCD'[newIdx] : 'ABCD'[i];
  }
  var replacements = [];
  item.o.forEach(function(optText, idx){
    var oL = 'ABCD'[idx];
    var nL = letterMap[oL];
    if(oL === nL) return;
    var longPat = oL + optText;
    var pos = 0;
    while((pos = text.indexOf(longPat, pos)) !== -1){
      replacements.push({start:pos, end:pos + longPat.length, text:nL + optText});
      pos += longPat.length;
    }
    ['选项' + oL, '（' + oL + '）', '【' + oL + '】'].forEach(function(p){
      var p2 = 0;
      while((p2 = text.indexOf(p, p2)) !== -1){
        replacements.push({start:p2, end:p2 + p.length, text:p.split(oL).join(nL)});
        p2 += p.length;
      }
    });
  });
  if(replacements.length === 0) return text;
  replacements.sort(function(a,b){ return b.start - a.start; });
  var filtered = [];
  var lastStart = Infinity;
  replacements.forEach(function(r){
    if(r.end <= lastStart){ filtered.push(r); lastStart = r.start; }
  });
  var result = text;
  filtered.forEach(function(r){
    result = result.slice(0, r.start) + r.text + result.slice(r.end);
  });
  return result;
}

/* ===== 选项分析提取 ===== */
function extractOptAnalysis(exp, item){
  if(!exp || item.type === 'judge') return null;
  if(exp.o && typeof exp.o === 'object'){
    var explicit = {};
    ['A','B','C','D'].forEach(function(L){ if(exp.o[L]) explicit[L] = exp.o[L]; });
    if(Object.keys(explicit).length > 0) return explicit;
  }
  if(exp.opts && typeof exp.opts === 'object'){
    var exp2 = {};
    ['A','B','C','D'].forEach(function(L){ if(exp.opts[L]) exp2[L] = exp.opts[L]; });
    if(Object.keys(exp2).length > 0) return exp2;
  }
  var w = exp.w;
  if(!w) return null;
  var matches = [];
  item.o.forEach(function(optText, idx){
    var letter = 'ABCD'[idx];
    var patterns = [letter + optText, letter + '、', letter + '：', letter + '.', '选项' + letter, '（' + letter + '）'];
    for(var p = 0; p < patterns.length; p++){
      var pos = w.indexOf(patterns[p]);
      if(pos >= 0){ matches.push({letter:letter, pos:pos, len:patterns[p].length}); break; }
    }
  });
  if(matches.length === 0) return null;
  matches.sort(function(a,b){ return a.pos - b.pos; });
  var seen = {};
  var uniq = [];
  matches.forEach(function(m){
    if(!seen[m.letter]){ seen[m.letter] = true; uniq.push(m); }
  });
  var result = {};
  uniq.forEach(function(m, i){
    var start = m.pos + m.len;
    var end = (i + 1 < uniq.length) ? uniq[i + 1].pos : w.length;
    var text = w.slice(start, end).trim();
    text = text.replace(/^[、，,；;：:\s]+/, '').replace(/[；;。\s]+$/, '');
    if(text) result[m.letter] = text;
  });
  return Object.keys(result).length > 0 ? result : null;
}

/* ===== 知识点卡片 ===== */
function buildKnowledgeHtml(k){
  if(!k) return '';
  var kw = kbKeyword(k);
  var sub = kbSub(k);
  var links = KB_LINKS[kw];
  var count = countByKeyword(kw);
  var html = '<div class="k-main">';
  html += '<span class="k-chip" data-kw="' + esc(kw) + '" title="查看「' + esc(kw) + '」的全部题目（共 ' + count + ' 题）">';
  html += '<span class="k-icon">📚</span>' + esc(kw);
  html += '<span class="k-plus">＋</span>';
  html += '</span>';
  if(sub) html += '<span class="k-sub">' + esc(sub) + '</span>';
  html += '</div>';
  if(links && links.length){
    html += '<div class="k-links">';
    links.forEach(function(L){
      html += '<a class="k-link" href="' + esc(L.url) + '" target="_blank" rel="noopener noreferrer">' + esc(L.name) + '<span class="k-arrow">↗</span></a>';
    });
    html += '</div>';
  }
  return html;
}

/* ===== 解析卡片 ===== */
function buildExplainHtml(exp, ok, compact, item, session){
  if(!exp) return '';
  var ansText = exp.a ? remapExpText(exp.a, item, session) : '';
  var view = getView(item, session);
  var html = '<div class="explain ' + (ok ? 'ok' : 'bad') + '"' + (compact ? ' style="margin-top:8px"' : '') + '>' +
    '<div class="exp-head">' +
      '<div class="exp-head-icon">' + (ok ? '✓' : '✗') + '</div>' +
      '<div class="exp-head-title">题目解析</div>' +
      (compact ? '' : '<div class="exp-head-status">' + (ok ? '正确' : '错误') + '</div>') +
    '</div><div class="exp-body">';
  if(exp.k){
    html += '<div class="exp-block"><div class="exp-label">知识点</div>' + buildKnowledgeHtml(exp.k) + '</div>';
  }
  if(ansText){
    html += '<div class="exp-block"><div class="exp-label">答案解析</div><p>' + esc(ansText) + '</p></div>';
  }
  if(item.type === 'single'){
    var optAnalysis = extractOptAnalysis(exp, item);
    if(optAnalysis){
      html += '<div class="exp-block"><div class="exp-label">选项详解</div><div class="exp-options">';
      for(var i = 0; i < item.o.length; i++){
        var dispLetter = 'ABCD'[i];
        var dispText = view.o[i];
        var isCorrect = (i === view.a);
        var origIdx = (view.orig && view.orig[i] !== undefined) ? view.orig[i] : i;
        var origLetter = 'ABCD'[origIdx];
        var analysisText = optAnalysis[origLetter];
        if(!analysisText && isCorrect){
          analysisText = remapExpText(exp.a || '', item, session) || '这是本题的正确答案。';
        }
        if(!analysisText) analysisText = '暂无详细分析。';
        analysisText = remapExpText(analysisText, item, session);
        html += '<div class="exp-option ' + (isCorrect ? 'is-right' : 'is-wrong') + '">' +
          '<span class="opt-tag">' + dispLetter + '</span>' +
          '<div class="opt-content">' +
            '<div class="opt-text">' + esc(dispText) + '</div>' +
            '<div class="opt-analysis">' + esc(analysisText) + '</div>' +
          '</div>' +
        '</div>';
      }
      html += '</div></div>';
    } else if(exp.w){
      var wt = remapExpText(exp.w, item, session);
      html += '<div class="exp-block"><div class="exp-label">错项分析</div><div class="exp-options"><div class="exp-option is-wrong"><span class="opt-tag">!</span><div class="opt-content"><div class="opt-analysis">' + esc(wt) + '</div></div></div></div></div>';
    }
  }
  html += '</div></div>';
  return html;
}

/* ===== 状态 ===== */
var LS_SESSIONS = 'dg4_sessions_v9';
var LS_EXAM_CFG = 'dg4_exam_cfg_v1';
var state = {
  mode:'all', queue:[], pos:0, sessions:[], currentId:null,
  histView:'list', histSessionId:null, histDetailTab:'wrong',
  topicKeyword:'', favFilter:'all', pending:{},
  examCfg:{count:50, time:60, scope:'all'}
};

function loadSessions(){
  try{
    var raw = localStorage.getItem(LS_SESSIONS);
    if(raw){
      var d = JSON.parse(raw);
      state.sessions = Array.isArray(d.sessions) ? d.sessions : [];
      state.currentId = d.currentId || null;
    }
  }catch(e){ state.sessions = []; state.currentId = null; }
  state.sessions = state.sessions.filter(function(s){ return !s.isTemp; });
  if(!state.sessions.length) state.currentId = null;
  state.sessions.forEach(function(s){
    if(s.optsMap && !s.optsMapOrder) s.optsMapOrder = Object.keys(s.optsMap);
  });
}
function saveSessions(){
  try{
    var toSave = state.sessions.filter(function(s){ return !s.isTemp; });
    localStorage.setItem(LS_SESSIONS, JSON.stringify({sessions:toSave, currentId:state.currentId}));
  }catch(e){}
}
function loadExamCfg(){
  try{
    var raw = localStorage.getItem(LS_EXAM_CFG);
    if(raw){
      var d = JSON.parse(raw);
      if(d && typeof d === 'object'){
        Object.keys(d).forEach(function(k){ state.examCfg[k] = d[k]; });
      }
    }
  }catch(e){}
}
function saveExamCfg(){ try{ localStorage.setItem(LS_EXAM_CFG, JSON.stringify(state.examCfg)); }catch(e){} }

function getSession(id){
  for(var i = 0; i < state.sessions.length; i++){
    if(state.sessions[i].id === id) return state.sessions[i];
  }
  return null;
}
function getCurrentSession(){
  var s = getSession(state.currentId);
  if(!s) s = createSession(state.mode);
  return s;
}
function createSession(mode, name, isTemp){
  var s = {
    id:'s' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    name: name || ('第' + (state.sessions.length + 1) + '次练习'),
    mode: mode, createdAt:Date.now(), updatedAt:Date.now(),
    answers:{}, optsMap:{}, optsMapOrder:[], isTemp:!!isTemp,
    topicKeyword: mode === 'topic' ? state.topicKeyword : ''
  };
  state.sessions.push(s);
  state.currentId = s.id;
  saveSessions();
  return s;
}
function sessionForMode(mode){
  for(var i = state.sessions.length - 1; i >= 0; i--){
    var s = state.sessions[i];
    if(s.isTemp) continue;
    if(s.mode === mode){
      if(mode !== 'topic') return s;
      if(s.topicKeyword === state.topicKeyword) return s;
    }
  }
  return null;
}
function sessionStats(s){
  var total = 0, right = 0, wrong = 0;
  Object.keys(s.answers).forEach(function(no){
    var item = BY_NO[no];
    if(!item) return;
    var v = getView(item, s);
    total++;
    if(s.answers[no].c === v.a) right++; else wrong++;
  });
  return {total:total, right:right, wrong:wrong};
}
function computeWrongSet(){
  var last = {};
  state.sessions.forEach(function(s){
    if(s.isTemp) return;
    Object.keys(s.answers).forEach(function(no){
      var a = s.answers[no];
      if(!last[no] || a.t > last[no].t) last[no] = {c:a.c, t:a.t, session:s};
    });
  });
  var set = new Set();
  Object.keys(last).forEach(function(no){
    var item = BY_NO[no];
    if(!item) return;
    var v = getView(item, last[no].session);
    if(last[no].c !== v.a) set.add(Number(no));
  });
  return set;
}

function buildQueue(mode){
  var all = BANK.map(function(_, i){ return i; });
  if(mode === 'single') return all.filter(function(i){ return BANK[i].type === 'single'; });
  if(mode === 'judge') return all.filter(function(i){ return BANK[i].type === 'judge'; });
  if(mode === 'wrong'){ var ws = computeWrongSet(); return all.filter(function(i){ return ws.has(BANK[i].no); }); }
  if(mode === 'random') return shuffle(all.slice());
  if(mode === 'favorite') return all.filter(function(i){ return state_favorites.has(BANK[i].no); });
  if(mode === 'topic'){
    var kw = state.topicKeyword;
    return all.filter(function(i){
      return BANK[i].exp && BANK[i].exp.k && kbKeyword(BANK[i].exp.k) === kw;
    });
  }
  return all;
}

function collapseTopbar(){ $('topbar').classList.add('collapsed'); updateMiniBar(); }
function expandTopbar(){ $('topbar').classList.remove('collapsed'); }
function updateMiniBar(){
  var sess = getCurrentSession();
  var done = 0, right = 0;
  state.queue.forEach(function(i){
    var it = BANK[i], rec = sess.answers[it.no];
    if(rec !== undefined){
      done++;
      var v = getView(it, sess);
      if(rec.c === v.a) right++;
    }
  });
  $('miniMode').textContent = MODE_NAMES[state.mode] || '练习';
  $('miniProg').textContent = state.queue.length ? ('第 ' + (state.pos + 1) + ' / ' + state.queue.length + ' 题') : '暂无题目';
  var rateEl = $('miniRate');
  if(done === 0) rateEl.textContent = '未作答';
  else rateEl.textContent = '已答 ' + done + ' · 正确 ' + Math.round(right / done * 100) + '%';
}

/* ===== 考试 ===== */
var examTimer = null;
function isExamActive(sess){ return sess.isExam && !sess.submitted; }
function startExam(){
  var cfg = state.examCfg;
  var pool;
  if(cfg.scope === 'single') pool = BANK.filter(function(it){ return it.type === 'single'; });
  else if(cfg.scope === 'judge') pool = BANK.filter(function(it){ return it.type === 'judge'; });
  else pool = BANK.slice();
  var count = cfg.count === 0 ? pool.length : Math.min(cfg.count, pool.length);
  var picked = shuffle(pool.slice()).slice(0, count);
  state.sessions = state.sessions.filter(function(x){ return !x.isTemp; });
  var s = createSession('exam', '模拟考试 · ' + new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}), true);
  s.isExam = true; s.submitted = false;
  s.examCfg = {count:count, time:cfg.time, scope:cfg.scope};
  s.deadline = Date.now() + cfg.time * 60 * 1000;
  s.startedAt = Date.now();
  var idxs = [];
  picked.forEach(function(it){
    for(var i = 0; i < BANK.length; i++){
      if(BANK[i].no === it.no){ idxs.push(i); break; }
    }
  });
  state.queue = idxs; state.pos = 0; state.currentId = s.id;
  state.mode = 'exam'; state.pending = {};
  s.optsMap = {}; s.optsMapOrder = [];
  idxs.forEach(function(idx){
    var it = BANK[idx];
    if(it.type === 'single'){
      s.optsMap[it.no] = makeShuffledOpts(it);
      s.optsMapOrder.push(it.no);
    }
  });
  saveSessions();
  updateModeButtons();
  render();
  startExamTimer();
  window.scrollTo({top:0, behavior:'smooth'});
  showToast('🎯 模拟考试开始 · ' + count + ' 题 · ' + cfg.time + ' 分钟');
}
function startExamTimer(){
  if(examTimer) clearInterval(examTimer);
  updateExamTimer();
  examTimer = setInterval(function(){
    var sess = getSession(state.currentId);
    if(!sess || !sess.isExam || sess.submitted){
      clearInterval(examTimer); examTimer = null; return;
    }
    updateExamTimer();
    if(Date.now() >= sess.deadline){
      clearInterval(examTimer); examTimer = null; autoSubmitExam();
    }
  }, 1000);
}
function updateExamTimer(){
  var sess = getSession(state.currentId);
  if(!sess || !sess.isExam || sess.submitted){ $('examBar').classList.remove('show'); return; }
  $('examBar').classList.add('show');
  var remain = Math.max(0, sess.deadline - Date.now());
  var sec = Math.floor(remain / 1000);
  var m = Math.floor(sec / 60), s = sec % 60;
  var timerEl = $('examTimer');
  timerEl.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  timerEl.classList.toggle('warn', remain < 60000);
  var done = Object.keys(sess.answers).length;
  $('examInfo').textContent = done + ' / ' + state.queue.length + ' 已答';
}
function submitExam(){
  var sess = getSession(state.currentId);
  if(!sess || !sess.isExam || sess.submitted) return;
  var done = Object.keys(sess.answers).length;
  var total = state.queue.length;
  var msg = done < total ? '还有 ' + (total - done) + ' 题未作答，确定要交卷吗？' : '确定要交卷吗？';
  if(!confirm(msg)) return;
  doSubmitExam(sess);
}
function autoSubmitExam(){
  var sess = getSession(state.currentId);
  if(!sess || sess.submitted) return;
  showToast('⏰ 考试时间到，自动交卷');
  doSubmitExam(sess);
}
function doSubmitExam(sess){
  sess.submitted = true;
  sess.submittedAt = Date.now();
  saveSessions();
  if(examTimer){ clearInterval(examTimer); examTimer = null; }
  $('examBar').classList.remove('show');
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}
function renderExamResult(sess){
  var stat = sessionStats(sess);
  var total = state.queue.length;
  var right = stat.right, wrong = stat.wrong;
  var unanswered = total - stat.total;
  var rate = total > 0 ? Math.round(right / total * 100) : 0;
  var used = (sess.submittedAt || Date.now()) - (sess.startedAt || sess.createdAt);
  var html = '<div class="result-card">' +
    '<div class="result-head">' +
      '<div><span class="result-score">' + right + '</span><span class="result-total">/ ' + total + '</span></div>' +
      '<div class="result-label">正确率 ' + rate + '% · 用时 ' + fmtDuration(used) + '</div>' +
    '</div>' +
    '<div class="result-stats">' +
      '<div class="result-stat ok"><b>' + right + '</b><span>正确</span></div>' +
      '<div class="result-stat bad"><b>' + wrong + '</b><span>错误</span></div>' +
      '<div class="result-stat"><b>' + unanswered + '</b><span>未答</span></div>' +
    '</div>' +
    '<div class="result-btns">' +
      '<button class="btn-primary" id="examRestart">再考一次</button>' +
      '<button class="btn-ghost" id="examReview">查看错题</button>' +
      '<button class="btn-ghost" id="examBack">返回首页</button>' +
    '</div>';
  if(wrong > 0 || unanswered > 0){
    html += '<div class="result-wrong-list"><div class="exp-label" style="margin-bottom:10px">错题与未答</div>';
    state.queue.forEach(function(idx){
      var it = BANK[idx];
      var rec = sess.answers[it.no];
      var v = getView(it, sess);
      var isWrong = !rec || rec.c !== v.a;
      if(!isWrong) return;
      var recText = rec ? ('ABCD'[rec.c] + '. ' + v.o[rec.c]) : '未作答';
      var rightText = 'ABCD'[v.a] + '. ' + v.o[v.a];
      html += '<div class="result-wrong-item">' +
        '<div class="rw-q">No.' + it.no + ' · ' + esc(it.q) + '</div>' +
        '<div class="rw-a">你的答案：<span class="yours">' + esc(recText) + '</span></div>' +
        '<div class="rw-a">正确答案：<span class="right">' + esc(rightText) + '</span></div>' +
      '</div>';
    });
    html += '</div>';
  }
  html += '</div>';
  card.innerHTML = html;
  var btnRestart = $('examRestart');
  if(btnRestart) btnRestart.addEventListener('click', function(){
    state.sessions = state.sessions.filter(function(x){ return !x.isTemp; });
    state.currentId = null; saveSessions();
    openExamModal();
  });
  var btnReview = $('examReview');
  if(btnReview) btnReview.addEventListener('click', function(){ enterExamReview(sess); });
  var btnBack = $('examBack');
  if(btnBack) btnBack.addEventListener('click', function(){
    state.sessions = state.sessions.filter(function(x){ return !x.isTemp; });
    state.currentId = null; saveSessions();
    switchMode('all');
  });
}
function enterExamReview(sess){
  var wrongNos = [];
  state.queue.forEach(function(idx){
    var it = BANK[idx];
    var rec = sess.answers[it.no];
    var v = getView(it, sess);
    if(!rec || rec.c !== v.a) wrongNos.push(it.no);
  });
  if(wrongNos.length === 0){ showToast('🎉 本次考试没有错题'); return; }
  state.sessions = state.sessions.filter(function(x){ return !x.isTemp; });
  var ns = createSession('wrong', '考试错题重练', true);
  state.mode = 'wrong'; state.pending = {};
  var idxs = [];
  wrongNos.forEach(function(no){
    for(var i = 0; i < BANK.length; i++){
      if(BANK[i].no === no){ idxs.push(i); break; }
    }
  });
  state.queue = idxs; state.pos = 0; state.currentId = ns.id;
  saveSessions(); updateModeButtons(); render();
  window.scrollTo({top:0, behavior:'smooth'});
  showToast('✏️ 已进入错题重练（不计入历史）共 ' + idxs.length + ' 题');
}
function openExamModal(){
  var cfg = state.examCfg;
  var cg = $('examCountGroup');
  Array.prototype.forEach.call(cg.querySelectorAll('button'), function(b){
    b.classList.toggle('active', parseInt(b.dataset.count,10) === cfg.count);
  });
  var tg = $('examTimeGroup');
  Array.prototype.forEach.call(tg.querySelectorAll('button'), function(b){
    b.classList.toggle('active', parseInt(b.dataset.time,10) === cfg.time);
  });
  var sg = $('examScopeGroup');
  Array.prototype.forEach.call(sg.querySelectorAll('button'), function(b){
    b.classList.toggle('active', b.dataset.scope === cfg.scope);
  });
  $('examModal').classList.add('show');
}
function closeExamModal(){ $('examModal').classList.remove('show'); }

/* ===== 答题卡 ===== */
function currentItem(){ return BANK[state.queue[state.pos]]; }

function render(){
  var sess = getCurrentSession();
  if(sess.isExam && sess.submitted){ renderExamResult(sess); return; }
  if(state.queue.length === 0){
    var tipMsg = state.mode === 'wrong' ? '错题本是空的，先去全部练习刷题吧' :
                 state.mode === 'favorite' ? '还没有收藏任何题目，点击题目右上角 ★ 收藏' :
                 state.mode === 'topic' ? '当前知识点下暂无题目' : '请切换其他分组';
    card.innerHTML = '<div class="empty">🎉 当前分组没有题目<br><span>' + tipMsg + '</span></div>';
    updateStats(); updateNav(); updateAnswerSheet(); updateExamTimer();
    return;
  }
  var item = currentItem();
  ensureOptsForItem(sess, item);
  var view = getView(item, sess);
  var rec = sess.answers[item.no];
  var answered = (rec !== undefined);
  var chosen = answered ? rec.c : undefined;
  var isExamActiveFlag = isExamActive(sess);
  var showShuffled = ((state.mode === 'random' || sess.isExam) && item.type === 'single');
  var isFav = state_favorites.has(item.no);
  var pendingChoice = state.pending[item.no];
  card.innerHTML =
    '<div class="qhead">' +
      '<div class="qhead-left">' +
        '<span class="tag ' + (item.type === 'judge' ? 'judge' : '') + '">' + (item.type === 'single' ? '单选题' : '判断题') + '</span>' +
        (sess.isExam ? '<span class="tag exam">考试中</span>' : '') +
        (showShuffled && !sess.isExam ? '<span class="tag shuffled">选项已打乱</span>' : '') +
        '<span class="qno">第 ' + (state.pos + 1) + ' / ' + state.queue.length + ' 题 · No.' + item.no + '</span>' +
      '</div>' +
      '<div class="qhead-right">' +
        '<button type="button" class="star-btn ' + (isFav ? 'active' : '') + '" id="starBtn" title="' + (isFav ? '取消收藏' : '收藏本题') + '">' + (isFav ? '★' : '☆') + '</button>' +
      '</div>' +
    '</div>' +
    '<div class="qtext">' + esc(item.q) + '</div>' +
    '<div class="opts" id="opts"></div>' +
    '<div class="feedback" id="fb"></div>';
  var optsEl = $('opts');
  view.o.forEach(function(text, i){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt';
    b.innerHTML = '<span class="letter">' + 'ABCD'[i] + '</span><span>' + esc(text) + '</span>';
    if(answered){
      b.classList.add('locked');
      if(isExamActiveFlag){
        if(i === chosen) b.classList.add('selected');
      }else{
        if(i === view.a) b.classList.add('right');
        else if(i === chosen) b.classList.add('wrong');
      }
    }else{
      if(i === pendingChoice) b.classList.add('selected');
      b.addEventListener('click', function(){ choose(i); });
    }
    optsEl.appendChild(b);
  });
  var fb = $('fb');
  if(answered){
    if(isExamActiveFlag){
      fb.className = 'feedback';
      fb.innerHTML = '<span class="exam-hint">✓ 已选择 ' + ('ABCD'[chosen]) + '，考试结束后显示答案和解析</span>';
    }else{
      var ok = (chosen === view.a);
      fb.className = 'feedback ' + (ok ? 'ok' : 'bad');
      var html = '';
      var ansLetter = 'ABCD'[view.a];
      var ansText = view.o[view.a];
      if(ok){
        html += '<div class="fb-line"><b>✓ 回答正确</b>　正确答案：' + ansLetter + '. ' + esc(ansText) + '</div>';
      }else{
        var chLetter = 'ABCD'[chosen];
        var chText = view.o[chosen];
        html += '<div class="fb-line"><b>✗ 回答错误</b>　正确答案：' + ansLetter + '. ' + esc(ansText) + '　（你选了 ' + chLetter + '. ' + esc(chText) + '）</div>';
      }
      html += buildExplainHtml(item.exp, ok, false, item, sess);
      fb.innerHTML = html;
    }
  }else{
    fb.className = 'feedback';
    var hintText = pendingChoice !== undefined
      ? '已选择 <b>' + ('ABCD'[pendingChoice]) + '</b>，点击确定提交答案'
      : '点击选项作答 · 键盘 A/B/C/D 或 1-4 也可作答';
    fb.innerHTML = '<span class="hint">' + hintText + '</span>' +
      '<button type="button" class="confirm-btn" id="confirmBtn"' + (pendingChoice === undefined ? ' disabled' : '') + '>确定</button>';
    var cb = $('confirmBtn');
    if(cb) cb.addEventListener('click', confirmChoice);
  }
  var sb = $('starBtn');
  if(sb){
    sb.addEventListener('click', function(e){
      e.stopPropagation();
      toggleFavorite(item.no);
      sb.classList.toggle('active', state_favorites.has(item.no));
      sb.textContent = state_favorites.has(item.no) ? '★' : '☆';
      sb.title = state_favorites.has(item.no) ? '取消收藏' : '收藏本题';
      sb.classList.add('pop');
      setTimeout(function(){ sb.classList.remove('pop'); }, 400);
      showToast(state_favorites.has(item.no) ? '★ 已加入收藏' : '已取消收藏');
    });
  }
  updateStats(); updateNav(); updateAnswerSheet(); updateExamTimer();
}

function updateStats(){
  var sess = getCurrentSession();
  var done = 0, right = 0;
  state.queue.forEach(function(i){
    var it = BANK[i], rec = sess.answers[it.no];
    if(rec !== undefined){
      done++;
      var v = getView(it, sess);
      if(rec.c === v.a) right++;
    }
  });
  var wrongN = done - right;
  var rate = done ? Math.round(right / done * 100) : 0;
  var elDone = $('statDone'), elRight = $('statRight'), elWrong = $('statWrong'), elRate = $('statRate');
  var prevDone = parseInt(elDone.textContent, 10) || 0;
  var prevRight = parseInt(elRight.textContent, 10) || 0;
  var prevWrong = parseInt(elWrong.textContent, 10) || 0;
  var prevRate = parseInt(elRate.textContent, 10) || 0;
  animateNumber(elDone, prevDone, done, 400);
  animateNumber(elRight, prevRight, right, 400);
  animateNumber(elWrong, prevWrong, wrongN, 400);
  animateNumber(elRate, prevRate, rate, 400, function(v){ return Math.round(v) + '%'; });
  $('progressBar').style.width = (state.queue.length ? (done / state.queue.length * 100) : 0) + '%';
  $('wrongBadge').textContent = computeWrongSet().size;
  updateMiniBar();
}
function updateNav(){
  $('prevBtn').disabled = state.pos <= 0;
  $('nextBtn').disabled = state.pos >= state.queue.length - 1;
}
function updateAnswerSheet(){
  var grid = $('asGrid');
  if(!grid) return;
  var sess = getCurrentSession();
  if(state.queue.length === 0){
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text-4);font-size:12.5px;padding:8px">暂无题目</div>';
    updateRing(0, 0); return;
  }
  var done = 0, html = '';
  var filter = state.favFilter;
  state.queue.forEach(function(i, idx){
    var it = BANK[i], rec = sess.answers[it.no];
    var v = getView(it, sess);
    var ok = rec !== undefined && rec.c === v.a;
    var answered = rec !== undefined;
    if(answered) done++;
    if(filter === 'unanswered' && answered) return;
    if(filter === 'wrong' && (!answered || ok)) return;
    if(filter === 'right' && (!answered || !ok)) return;
    if(filter === 'fav' && !state_favorites.has(it.no)) return;
    var cls = 'as-cell';
    if(answered) cls += ok ? ' right' : ' wrong';
    if(idx === state.pos) cls += ' current';
    if(state_favorites.has(it.no)) cls += ' fav';
    html += '<button type="button" class="' + cls + '" data-idx="' + idx + '" aria-label="第' + (idx + 1) + '题">' + (idx + 1) + '</button>';
  });
  if(!html) html = '<div style="grid-column:1/-1;text-align:center;color:var(--text-4);font-size:12.5px;padding:8px">当前筛选下没有题目</div>';
  grid.innerHTML = html;
  updateRing(done, state.queue.length);
}
function updateRing(done, total){
  var ring = $('ringFg'), pct = $('ringPct');
  if(!ring || !pct) return;
  var circumference = 2 * Math.PI * 8;
  var progress = total > 0 ? done / total : 0;
  ring.setAttribute('stroke-dashoffset', (circumference * (1 - progress)).toFixed(2));
  pct.textContent = total > 0 ? Math.round(progress * 100) + '%' : '0%';
}

/* ===== 交互 ===== */
function choose(i){
  if(state.queue.length === 0) return;
  var item = currentItem(), sess = getCurrentSession();
  if(sess.answers[item.no] !== undefined) return;
  state.pending[item.no] = i;
  render();
}
function confirmChoice(){
  if(state.queue.length === 0) return;
  var item = currentItem(), sess = getCurrentSession();
  if(sess.answers[item.no] !== undefined) return;
  var choice = state.pending[item.no];
  if(choice === undefined){ showToast('请先选择一个选项'); return; }
  sess.answers[item.no] = {c:choice, t:Date.now()};
  sess.updatedAt = Date.now();
  delete state.pending[item.no];
  saveSessions();
  var optsEl = $('opts');
  if(optsEl){
    var opt = optsEl.children[choice];
    if(opt){ opt.classList.add('tapped'); setTimeout(function(){ opt.classList.remove('tapped'); }, 250); }
  }
  render();
  if($('hpanel').classList.contains('show')) renderHistory();
}
function next(){ if(state.pos < state.queue.length - 1){ state.pos++; render(); } }
function prev(){ if(state.pos > 0){ state.pos--; render(); } }
function updateModeButtons(){
  Array.prototype.forEach.call(document.querySelectorAll('.modes button'), function(b){
    b.classList.toggle('active', b.dataset.mode === state.mode);
  });
}
function switchMode(mode){
  if(mode === 'topic' && !state.topicKeyword){ showToast('请先在解析卡中点击知识点标签进入专题'); return; }
  if(mode === 'exam'){ openExamModal(); return; }
  if(mode === 'favorite' && state_favorites.size === 0){
    showToast('还没有收藏任何题目，点击题目右上角 ★ 收藏');
    return;
  }
  state.mode = mode;
  state.pending = {};
  var s = sessionForMode(mode);
  if(!s) s = createSession(mode);
  state.currentId = s.id;
  state.queue = buildQueue(mode);
  if(state.queue.length === 0){
    if(mode === 'favorite'){
      showToast('收藏夹是空的，已切换回全部练习');
      state.mode = 'all';
      s = sessionForMode('all') || createSession('all');
      state.currentId = s.id;
      state.queue = buildQueue('all');
    }
  }
  if(mode === 'random'){
    if(!s.optsMap) s.optsMap = {};
    if(!s.optsMapOrder) s.optsMapOrder = [];
    state.queue.forEach(function(idx){
      var it = BANK[idx];
      if(it.type === 'single') ensureOptsForItem(s, it);
    });
    saveSessions();
    showToast('🎲 已进入随机练习 · 选项顺序已打乱');
  }
  var idx = 0;
  for(var i = 0; i < state.queue.length; i++){
    var no = BANK[state.queue[i]].no;
    if(s.answers[no] === undefined){ idx = i; break; }
    if(i === state.queue.length - 1) idx = i;
  }
  state.pos = idx;
  saveSessions();
  updateModeButtons();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}
function enterTopic(kw){
  var cnt = countByKeyword(kw);
  if(cnt === 0){ showToast('「' + kw + '」下暂无题目'); return; }
  state.topicKeyword = kw;
  state.mode = 'topic';
  state.pending = {};
  var s = sessionForMode('topic');
  if(!s) s = createSession('topic', '专题：' + kw);
  state.currentId = s.id;
  state.queue = buildQueue('topic');
  state.pos = 0;
  saveSessions();
  updateModeButtons();
  $('topicBtn').style.display = '';
  $('topicBtn').innerHTML = '专题：' + esc(kw) + ' <span class="badge">' + state.queue.length + '</span>';
  render();
  window.scrollTo({top:0, behavior:'smooth'});
  showToast('📚 已进入「' + kw + '」专题，共 ' + state.queue.length + ' 题');
}

/* ===== 导出 ===== */
function exportSession(session){
  if(!session) return;
  var stat = sessionStats(session);
  var lines = [];
  lines.push('# 电工四级理论题库 · ' + session.name);
  lines.push('');
  lines.push('练习时间：' + fmtTime(session.createdAt));
  if(session.isExam && session.startedAt && session.submittedAt){
    lines.push('用时：' + fmtDuration(session.submittedAt - session.startedAt));
  }
  lines.push('正确：' + stat.right + ' / 错误：' + stat.wrong + ' / 共：' + stat.total);
  lines.push(''); lines.push('---'); lines.push('');
  var wrongCount = 0;
  Object.keys(session.answers).forEach(function(no){
    var item = BY_NO[no];
    if(!item) return;
    var rec = session.answers[no];
    var v = getView(item, session);
    if(rec.c === v.a) return;
    wrongCount++;
    lines.push('### 第 ' + wrongCount + ' 题（No.' + item.no + '）');
    lines.push('');
    lines.push('**' + item.q + '**');
    lines.push('');
    item.o.forEach(function(opt, i){
      var letter = 'ABCD'[i];
      var mark = '';
      if(i === v.a) mark = ' ✓';
      else if(i === rec.c) mark = ' ✗';
      lines.push('- ' + letter + '. ' + opt + mark);
    });
    lines.push('');
    lines.push('你的答案：' + ('ABCD'[rec.c]) + '. ' + v.o[rec.c]);
    lines.push('正确答案：' + ('ABCD'[v.a]) + '. ' + v.o[v.a]);
    if(item.exp && item.exp.a) lines.push('解析：' + item.exp.a);
    lines.push('');
  });
  if(wrongCount === 0) lines.push('🎉 本次练习没有错题！');
  var text = lines.join('\n');
  var blob = new Blob([text], {type:'text/plain;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = (session.name || '练习记录') + '.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  showToast('📄 已导出为文本文件');
}

/* ===== 历史记录 ===== */
function openHistory(){
  state.histView = 'list'; state.histSessionId = null;
  renderHistory();
  $('hpanel').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeHistory(){
  $('hpanel').classList.remove('show');
  document.body.style.overflow = '';
}
function renderHistory(){
  if(state.histView === 'detail') renderSessionDetail();
  else renderSessionList();
}
function renderSessionList(){
  $('hpBack').style.display = 'none';
  $('hpTabs').style.display = 'none';
  $('hpTitle').textContent = '历史记录';
  var list = state.sessions.filter(function(s){
    if(s.isTemp) return false;
    return Object.keys(s.answers).length > 0 || s.id === state.currentId;
  }).sort(function(a,b){ return b.updatedAt - a.updatedAt; });
  $('hpSub').textContent = list.length ? ('共 ' + list.length + ' 次练习记录') : '暂无记录';
  var box = $('hlist');
  if(list.length === 0){
    box.innerHTML = '<div class="empty">暂无练习记录<br><span>去练习吧，每次作答都会自动保存</span></div>';
    $('hpFoot').innerHTML = '<button class="ghost-sm" id="hpClearAll">清空全部历史</button>';
    return;
  }
  box.innerHTML = list.map(function(s){
    var stat = sessionStats(s);
    var isLive = (s.id === state.currentId);
    var examTag = s.isExam ? '<span class="exam-badge">考试</span>' : '';
    return '<div class="session-card ' + (isLive ? 'live' : '') + '" data-id="' + s.id + '">' +
      '<div class="sc-top">' +
        '<div class="hname-wrap">' +
          '<span class="hname" data-id="' + s.id + '">' + esc(s.name) + '</span>' +
          examTag +
          (isLive ? '<span class="live-badge">正在练习中</span>' : '') +
        '</div>' +
        '<span class="sc-time">' + fmtTime(s.updatedAt) + '</span>' +
      '</div>' +
      '<div class="sc-mode">' + (MODE_NAMES[s.mode] || s.mode) + (s.mode === 'topic' && s.topicKeyword ? '：' + esc(s.topicKeyword) : '') + '</div>' +
      '<div class="sc-stats">' +
        '<span class="ok-t">✓ 正确 ' + stat.right + '</span>' +
        '<span class="bad-t">✗ 错误 ' + stat.wrong + '</span>' +
        '<span class="tot-t">共 ' + stat.total + ' 题</span>' +
      '</div>' +
      '<button type="button" class="sc-del" data-del="' + s.id + '" title="删除该记录">🗑</button>' +
    '</div>';
  }).join('');
  $('hpFoot').innerHTML = '<button class="ghost-sm" id="hpClearAll">清空全部历史</button>';
}
function renderSessionDetail(){
  var s = getSession(state.histSessionId);
  if(!s){ state.histView = 'list'; renderHistory(); return; }
  var stat = sessionStats(s);
  $('hpBack').style.display = 'block';
  $('hpTitle').textContent = s.name;
  $('hpSub').textContent = (MODE_NAMES[s.mode] || s.mode) + ' · 正确 ' + stat.right + ' / 错误 ' + stat.wrong + ' / 共 ' + stat.total + ' 题';
  $('hpTabs').style.display = 'flex';
  $('htWrong').textContent = '错题 ' + stat.wrong;
  $('htAll').textContent = '全部 ' + stat.total;
  $('htWrong').classList.toggle('active', state.histDetailTab === 'wrong');
  $('htAll').classList.toggle('active', state.histDetailTab === 'all');
  var footHtml = '';
  if(stat.wrong > 0) footHtml += '<button class="primary-sm" id="hpReview">重新练习错题 (' + stat.wrong + ')</button>';
  footHtml += '<button class="ghost-sm" id="hpExport">导出错题</button>';
  footHtml += '<button class="ghost-sm" id="hpClearAll">清空全部历史</button>';
  $('hpFoot').innerHTML = footHtml;
  var entries = [];
  Object.keys(s.answers).forEach(function(no){
    var item = BY_NO[no];
    if(!item) return;
    var rec = s.answers[no];
    var v = getView(item, s);
    var ok = rec.c === v.a;
    if(state.histDetailTab === 'wrong' && ok) return;
    entries.push({it:item, rec:rec, ok:ok});
  });
  entries.sort(function(a,b){ return a.it.no - b.it.no; });
  var box = $('hlist');
  if(entries.length === 0){
    box.innerHTML = '<div class="empty">' + (state.histDetailTab === 'wrong' ? '本次练习没有错题 🎉' : '暂无作答记录') + '</div>';
    return;
  }
  box.innerHTML = entries.map(function(x){
    var v = getView(x.it, s);
    var recLetter = 'ABCD'[x.rec.c];
    var recText = v.o[x.rec.c];
    var rightLetter = 'ABCD'[v.a];
    var rightText = v.o[v.a];
    return '<div class="hitem">' +
      '<div class="hrow"><span class="tag ' + (x.it.type === 'judge' ? 'judge' : '') + '">' + (x.it.type === 'single' ? '单选题' : '判断题') + '</span><span class="hno">No.' + x.it.no + '</span></div>' +
      '<div class="hq">' + esc(x.it.q) + '</div>' +
      '<div class="ha">你的答案：<span class="' + (x.ok ? 'right' : 'yours') + '">' + recLetter + '. ' + esc(recText) + '</span></div>' +
      (x.ok ? '' : '<div class="ha">正确答案：<span class="right">' + rightLetter + '. ' + esc(rightText) + '</span></div>') +
      buildExplainHtml(x.it.exp, x.ok, true, x.it, s) +
    '</div>';
  }).join('');
}
function reviewSessionWrong(sessionId){
  var s = getSession(sessionId);
  if(!s) return;
  var wrongNos = [];
  Object.keys(s.answers).forEach(function(no){
    var item = BY_NO[no];
    if(!item) return;
    var v = getView(item, s);
    if(s.answers[no].c !== v.a) wrongNos.push(Number(no));
  });
  if(wrongNos.length === 0) return;
  state.sessions = state.sessions.filter(function(x){ return !x.isTemp; });
  var ns = createSession('wrong', s.name + ' · 错题重练', true);
  state.mode = 'wrong'; state.pending = {};
  var idxs = [];
  wrongNos.forEach(function(no){
    for(var i = 0; i < BANK.length; i++){
      if(BANK[i].no === no){ idxs.push(i); break; }
    }
  });
  state.queue = idxs; state.pos = 0; state.currentId = ns.id;
  saveSessions();
  closeHistory();
  updateModeButtons();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
  showToast('✏️ 已进入错题重练（不计入历史）共 ' + idxs.length + ' 题');
}
function startRename(el){
  var id = el.dataset.id;
  var s = getSession(id);
  if(!s) return;
  var input = document.createElement('input');
  input.type = 'text';
  input.className = 'hname-input';
  input.value = s.name;
  input.maxLength = 30;
  el.replaceWith(input);
  input.focus();
  input.select();
  var done = false;
  function commit(){
    if(done) return;
    done = true;
    var v = input.value.trim();
    if(v) s.name = v;
    saveSessions();
    renderHistory();
  }
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', function(ev){
    if(ev.key === 'Enter'){ ev.preventDefault(); input.blur(); }
    else if(ev.key === 'Escape'){ input.value = s.name; input.blur(); }
    ev.stopPropagation();
  });
}

/* ===== 继续上次练习 ===== */
function checkResume(){
  var sess = getCurrentSession();
  if(sess && state.queue && state.queue.length && !sess.isTemp && !sess.isExam){
    var un = 0;
    state.queue.forEach(function(i){ if(sess.answers[BANK[i].no] === undefined) un++; });
    if(un > 0 && un < state.queue.length){
      $('resumeText').innerHTML = '上次「<b>' + esc(sess.name) + '</b>」还剩 <b>' + un + '</b> 题未答，是否继续？';
      $('resumeBar').classList.add('show');
      $('resumeBar').dataset.sid = '';
      return;
    }
  }
  var list = state.sessions.filter(function(s){
    if(s.isTemp) return false;
    if(s.isExam) return false;
    if(!s.answers) return false;
    if(s.id === state.currentId) return false;
    var total = Object.keys(s.answers).length;
    if(total === 0) return false;
    var qlen = 0;
    if(s.mode === 'all') qlen = BANK.length;
    else if(s.mode === 'single') qlen = BANK.filter(function(it){ return it.type === 'single'; }).length;
    else if(s.mode === 'judge') qlen = BANK.filter(function(it){ return it.type === 'judge'; }).length;
    else if(s.mode === 'random') qlen = BANK.length;
    else if(s.mode === 'wrong') qlen = -1;
    else if(s.mode === 'favorite') qlen = state_favorites.size;
    else if(s.mode === 'topic') qlen = BANK.filter(function(it){
      return it.exp && it.exp.k && kbKeyword(it.exp.k) === s.topicKeyword;
    }).length;
    if(qlen > 0 && total < qlen) return true;
    return false;
  }).sort(function(a,b){ return b.updatedAt - a.updatedAt; });
  if(list.length === 0) return;
  var s = list[0];
  $('resumeText').innerHTML = '上次「<b>' + esc(s.name) + '</b>」尚未完成，是否继续？';
  $('resumeBar').classList.add('show');
  $('resumeBar').dataset.sid = s.id;
}
function hideResume(){
  $('resumeBar').classList.remove('show');
  $('resumeBar').dataset.sid = '';
}
function resumeToSession(){
  var sid = $('resumeBar').dataset.sid;
  if(sid){
    var s = getSession(sid);
    if(!s){ hideResume(); return; }
    state.mode = s.mode;
    if(s.mode === 'topic') state.topicKeyword = s.topicKeyword || '';
    state.currentId = s.id;
    state.queue = buildQueue(s.mode);
    if(s.mode === 'random'){
      if(!s.optsMap) s.optsMap = {};
      if(!s.optsMapOrder) s.optsMapOrder = [];
      state.queue.forEach(function(idx){
        var it = BANK[idx];
        if(it.type === 'single') ensureOptsForItem(s, it);
      });
    }
    var p = 0;
    for(var i = 0; i < state.queue.length; i++){
      if(s.answers[BANK[state.queue[i]].no] === undefined){ p = i; break; }
    }
    state.pos = p;
    saveSessions();
    updateModeButtons();
    if(s.mode === 'topic'){
      $('topicBtn').style.display = '';
      $('topicBtn').innerHTML = '专题：' + esc(s.topicKeyword || '') + ' <span class="badge">' + state.queue.length + '</span>';
    }
  }else{
    var sess = getCurrentSession();
    var p = state.pos;
    for(var i = 0; i < state.queue.length; i++){
      if(sess.answers[BANK[state.queue[i]].no] === undefined){ p = i; break; }
    }
    state.pos = p;
  }
  hideResume();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}
function jumpTo(input){
  var v = parseInt(input, 10);
  if(isNaN(v)) return false;
  var idx = -1;
  for(var i = 0; i < state.queue.length; i++){
    if(BANK[state.queue[i]].no === v){ idx = i; break; }
  }
  if(idx >= 0){ state.pos = idx; render(); return true; }
  if(v >= 1 && v <= state.queue.length){ state.pos = v - 1; render(); return true; }
  return false;
}

$('redoBtn').addEventListener('click', function(){
  var cur = getCurrentSession();
  var n = Object.keys(cur.answers).length;
  if(cur.isExam && !cur.submitted){
    if(!confirm('当前正在考试中，开始新练习会结束本次考试。确定吗？')) return;
  }else if(n > 0 && !confirm('开始一次新的练习？当前进度会保存到「历史记录」。')) return;
  state.sessions = state.sessions.filter(function(x){ return !x.isTemp; });
  var ns = createSession(state.mode);
  state.queue = buildQueue(state.mode);
  state.pending = {};
  if(state.mode === 'random'){
    state.queue.forEach(function(idx){
      var it = BANK[idx];
      if(it.type === 'single') ensureOptsForItem(ns, it);
    });
  }
  state.pos = 0;
  saveSessions();
  render();
  showToast('✨ 已开始新的练习');
});

$('histBtn').addEventListener('click', openHistory);
$('hpClose').addEventListener('click', closeHistory);
$('hpBack').addEventListener('click', function(){
  state.histView = 'list';
  state.histSessionId = null;
  renderHistory();
});
$('htWrong').addEventListener('click', function(){ state.histDetailTab = 'wrong'; renderSessionDetail(); });
$('htAll').addEventListener('click', function(){ state.histDetailTab = 'all'; renderSessionDetail(); });

$('hlist').addEventListener('click', function(e){
  var delBtn = e.target.closest('.sc-del');
  if(delBtn){
    e.preventDefault(); e.stopPropagation();
    var sid = delBtn.dataset.del;
    var s = getSession(sid);
    if(!s) return;
    if(!confirm('确定要删除「' + s.name + '」这条练习记录吗？')) return;
    state.sessions = state.sessions.filter(function(x){ return x.id !== sid; });
    if(state.currentId === sid){
      state.currentId = null;
      var ns = createSession(state.mode);
      state.queue = buildQueue(state.mode);
      state.pos = 0;
      render();
    }
    saveSessions();
    renderHistory();
    return;
  }
  var nameEl = e.target.closest('.hname');
  if(nameEl){
    e.preventDefault(); e.stopPropagation();
    startRename(nameEl);
    return;
  }
  var cardEl = e.target.closest('.session-card');
  if(cardEl){
    state.histView = 'detail';
    state.histSessionId = cardEl.dataset.id;
    state.histDetailTab = 'wrong';
    renderHistory();
    $('hlist').scrollTop = 0;
    return;
  }
});

$('hpFoot').addEventListener('click', function(e){
  if(e.target.closest('#hpReview')){ reviewSessionWrong(state.histSessionId); return; }
  if(e.target.closest('#hpExport')){ var s = getSession(state.histSessionId); if(s) exportSession(s); return; }
  if(e.target.closest('#hpClearAll')){
    if(!confirm('确定要清空全部练习记录吗？此操作不可恢复。')) return;
    state.sessions = [];
    state.currentId = null;
    var ns = createSession(state.mode);
    state.queue = buildQueue(state.mode);
    state.pos = 0;
    saveSessions();
    state.histView = 'list';
    state.histSessionId = null;
    renderHistory();
    render();
  }
});

$('examModalCancel').addEventListener('click', closeExamModal);
$('examModal').addEventListener('click', function(e){ if(e.target === $('examModal')) closeExamModal(); });
$('examCountGroup').addEventListener('click', function(e){

$('examTimeGroup').addEventListener('click', function(e){

$('examScopeGroup').addEventListener('click', function(e){

$('examSubmit').addEventListener('click', submitExam);

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && $('hpanel').classList.contains('show')){
    if(state.histView === 'detail'){ state.histView = 'list'; state.histSessionId = null; renderHistory(); }
    else closeHistory();
    return;
  }
  if(e.key === 'Escape' && $('examModal').classList.contains('show')){ closeExamModal(); return; }
  if(e.target.tagName === 'INPUT') return;
  if(state.queue.length === 0) return;
  if($('hpanel').classList.contains('show')) return;
  if($('examModal').classList.contains('show')) return;
  var item = currentItem();
  var sess = getCurrentSession();
  var answered = sess.answers[item.no] !== undefined;
  var k = e.key.toUpperCase();
  if(k.length === 1 && 'ABCD'.indexOf(k) >= 0){
    var i1 = 'ABCD'.indexOf(k);
    if(i1 < item.o.length){ choose(i1); e.preventDefault(); }
  }else if(k.length === 1 && '1234'.indexOf(k) >= 0){
    var i2 = parseInt(k, 10) - 1;
    if(i2 < item.o.length){ choose(i2); e.preventDefault(); }
  }else if(e.key === 'Enter'){
    if(!answered) confirmChoice();
    e.preventDefault();
  }else if(e.key === 'ArrowRight'){ next(); }
  else if(e.key === 'ArrowLeft'){ prev(); }
  else if(k === 'S'){ if(item){ toggleFavorite(item.no); render(); } e.preventDefault(); }
});

(function(){
  var startX = 0, startY = 0, touching = false;
  card.addEventListener('touchstart', function(e){
    if(e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    touching = true;
  }, {passive:true});
  card.addEventListener('touchend', function(e){
    if(!touching) return;
    touching = false;
    if(!e.changedTouches.length) return;
    var dx = e.changedTouches[0].clientX - startX;
    var dy = e.changedTouches[0].clientY - startY;
    if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.2){
      if(dx < 0) next(); else prev();
    }
  }, {passive:true});
})();

function checkOrientation(){
  var isLandscape = window.innerWidth > window.innerHeight;
  var isSmallHeight = window.innerHeight < 520;
  if(isLandscape && isSmallHeight){
    $('topbar').classList.add('collapsed');
    updateMiniBar();
  }
}
window.addEventListener('resize', checkOrientation);
window.addEventListener('orientationchange', function(){ setTimeout(checkOrientation, 150); });
