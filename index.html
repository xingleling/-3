<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电工四级理论题库 · 在线练习</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       background:linear-gradient(180deg,#eef2ff 0%,#f6f8fc 260px,#f6f8fc 100%);color:#1f2937;min-height:100vh;
       transition:background .3s ease,color .3s ease}
  .wrap{max-width:820px;margin:0 auto;padding:14px 12px 110px}

  /* ===== 顶部区域（可收起） ===== */
  .topbar{margin-bottom:14px}
  .topbar-mini{display:none}
  .topbar.collapsed .topbar-full{display:none}
  .topbar.collapsed .topbar-mini{
    display:flex;align-items:center;gap:10px;
    background:#fff;border:1px solid #e8edf6;border-radius:14px;
    padding:11px 14px;cursor:pointer;
    box-shadow:0 4px 14px rgba(15,23,42,.06);
    font-size:13.5px;color:#334155;
    transition:.15s;
  }
  .topbar.collapsed .topbar-mini:active{transform:scale(.99)}
  .mini-icon{font-size:16px;line-height:1;flex:0 0 auto}
  .mini-mode{font-weight:700;color:#1e40af;flex:0 0 auto}
  .mini-prog{color:#64748b;flex:0 0 auto}
  .mini-rate{color:#94a3b8;flex:1;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini-expand{color:#2563eb;font-weight:700;flex:0 0 auto}

  header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 2px 14px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
  .logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#3b82f6,#6366f1);
        display:grid;place-items:center;font-size:20px;box-shadow:0 6px 14px rgba(59,130,246,.35);flex:0 0 auto}
  h1{font-size:17px;margin:0 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub{margin:0;font-size:12px;color:#64748b}
  .head-btns{display:flex;gap:5px;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end}
  .ghost{background:#fff;border:1px solid #dbe2ef;color:#475569;padding:8px 10px;border-radius:10px;
         font-size:12.5px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.18s}
  .ghost:active{transform:scale(.96)}
  .ghost.hl{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;border-color:transparent;
            box-shadow:0 6px 14px rgba(59,130,246,.3)}
  .ghost.icon{padding:8px 9px;line-height:1;font-size:13px;color:#64748b}
  .ghost.icon:hover{border-color:#bfd3f8;color:#2563eb}
  #themeBtn{font-size:15px;padding:7px 9px;line-height:1}

  .modes{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}
  .modes::-webkit-scrollbar{display:none}
  .modes button{flex:0 0 auto;padding:9px 14px;border-radius:999px;border:1px solid #dbe2ef;background:#fff;
                color:#475569;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:.18s;font-family:inherit}
  .modes button.active{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;border-color:transparent;
                       box-shadow:0 6px 14px rgba(59,130,246,.3)}
  .badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:#ef4444;color:#fff;
         font-size:11px;line-height:18px;text-align:center;vertical-align:1px}
  .statsbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
  .stat{background:#fff;border-radius:12px;padding:8px 4px;text-align:center;border:1px solid #e8edf6}
  .stat b{display:block;font-size:17px;line-height:1.35}
  .stat span{font-size:11.5px;color:#94a3b8}
  .stat.ok b{color:#16a34a}
  .stat.bad b{color:#dc2626}
  .progress{height:7px;border-radius:99px;background:#e2e8f4;overflow:hidden;margin-bottom:14px}
  .progress i{display:block;height:100%;width:0;border-radius:99px;
              background:linear-gradient(90deg,#3b82f6,#6366f1);transition:width .25s}
  .card{background:#fff;border-radius:18px;padding:18px 16px;box-shadow:0 10px 30px rgba(15,23,42,.07);
        border:1px solid #eef2f9;min-height:240px}
  .qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap}
  .tag{font-size:12px;padding:3px 10px;border-radius:8px;background:#eef4ff;color:#2563eb;font-weight:600}
  .tag.judge{background:#fff4e6;color:#d97706}
  .qno{font-size:12px;color:#94a3b8}
  .qtext{font-size:16.5px;line-height:1.68;font-weight:600;margin-bottom:16px;color:#111827}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:12px 14px;border-radius:12px;
       border:1.5px solid #e5eaf3;background:#fbfcff;font-size:15px;line-height:1.5;color:#1f2937;cursor:pointer;
       transition:.15s;font-family:inherit}
  .opt:hover{border-color:#bfd3f8;background:#f3f7ff}
  .opt .letter{flex:0 0 24px;height:24px;border-radius:7px;background:#eaf0fb;color:#4b6b9e;display:grid;
               place-items:center;font-size:13px;font-weight:700}
  .opt.right{border-color:#16a34a;background:#f0fdf4}
  .opt.right .letter{background:#16a34a;color:#fff}
  .opt.wrong{border-color:#dc2626;background:#fef2f2}
  .opt.wrong .letter{background:#dc2626;color:#fff}
  .opt.locked{cursor:default}
  .feedback{margin-top:14px;font-size:14px;min-height:22px;line-height:1.6}
  .feedback.ok{color:#16a34a}
  .feedback.bad{color:#dc2626}
  .hint{color:#9aa8bd;font-size:13px}
  .navbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);
          border-top:1px solid #e6ecf5;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
          display:flex;gap:8px;align-items:center;justify-content:center;z-index:50}
  .nav-btn{flex:1;max-width:220px;padding:12px;border-radius:12px;border:1px solid #dbe2ef;background:#fff;
           color:#334155;font-size:15px;cursor:pointer;font-family:inherit}
  .nav-btn.primary{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;border-color:transparent;
                   box-shadow:0 6px 16px rgba(59,130,246,.32)}
  .nav-btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
  .jump{display:flex;gap:4px;align-items:center}
  .jump input{width:64px;padding:10px 4px;border-radius:10px;border:1px solid #dbe2ef;text-align:center;
              font-size:14px;font-family:inherit;outline:none}
  .jump button{padding:10px;border-radius:10px;border:1px solid #dbe2ef;background:#fff;color:#475569;
               font-size:13px;cursor:pointer;font-family:inherit}
  .empty{text-align:center;padding:50px 10px;color:#475569;font-size:16px;line-height:2}
  .empty span{font-size:13px;color:#94a3b8}

  /* ===== 历史记录面板 ===== */
  .hpanel{position:fixed;top:0;bottom:0;left:0;right:0;z-index:120;background:#f6f8fc;
          display:none;flex-direction:column;max-width:820px;margin:0 auto;
          box-shadow:0 0 60px rgba(15,23,42,.18)}
  .hpanel.show{display:flex}
  .hp-head{display:flex;align-items:center;gap:10px;padding:12px 14px;
           background:#fff;border-bottom:1px solid #e9eef7}
  .hp-back{background:#f1f5fb;border:none;color:#475569;width:34px;height:34px;border-radius:10px;
           font-size:16px;cursor:pointer;line-height:1;font-family:inherit;flex:0 0 auto}
  .hp-back:active{transform:scale(.94)}
  .hp-title-wrap{flex:1;min-width:0}
  .hp-head h2{margin:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hp-head .sub2{margin:2px 0 0;font-size:11.5px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hp-close{background:#f1f5fb;border:none;color:#475569;width:34px;height:34px;border-radius:10px;
            font-size:15px;cursor:pointer;line-height:1;font-family:inherit;flex:0 0 auto}
  .hp-close:active{transform:scale(.94)}
  .hp-tabs{display:flex;gap:8px;padding:10px 14px;background:#fff;border-bottom:1px solid #e9eef7}
  .hp-tabs button{flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid #dbe2ef;background:#fff;
                  color:#475569;font-size:13px;cursor:pointer;font-family:inherit}
  .hp-tabs button.active{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;border-color:transparent}
  .hp-body{flex:1;overflow-y:auto;padding:12px 12px 20px;-webkit-overflow-scrolling:touch}
  .hp-foot{padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #e9eef7;
           display:flex;justify-content:center;gap:8px;align-items:center;flex-wrap:wrap}

  .session-card{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;
                border:1.5px solid #eef2f9;box-shadow:0 4px 14px rgba(15,23,42,.05);
                cursor:pointer;transition:.15s}
  .session-card:active{transform:scale(.985)}
  .session-card.live{border-color:#93b4f7;background:linear-gradient(180deg,#f7faff,#fff);
                     box-shadow:0 6px 20px rgba(59,130,246,.14)}
  .sc-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
  .hname-wrap{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
  .hname{font-size:15.5px;font-weight:700;color:#111827;cursor:pointer;
         border-bottom:1px dashed transparent;padding-bottom:1px}
  .hname:hover{border-bottom-color:#cbd5e1}
  .hname-input{font-size:15.5px;font-weight:700;font-family:inherit;color:#111827;
               border:1.5px solid #93b4f7;border-radius:8px;padding:2px 8px;outline:none;
               background:#fff;min-width:120px;max-width:200px}
  .live-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;
              color:#1d4ed8;background:#e3edff;border-radius:99px;padding:3px 9px;flex:0 0 auto}
  .live-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:#3b82f6;
                      animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
  .sc-time{font-size:11.5px;color:#94a3b8;flex:0 0 auto}
  .sc-mode{font-size:12px;color:#64748b;margin-bottom:8px}
  .sc-stats{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
  .sc-stats .ok-t{color:#16a34a;font-weight:700}
  .sc-stats .bad-t{color:#dc2626;font-weight:700}
  .sc-stats .tot-t{color:#94a3b8}

  .hitem{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;border:1px solid #eef2f9;
         box-shadow:0 4px 12px rgba(15,23,42,.04)}
  .hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .hno{font-size:11.5px;color:#94a3b8}
  .hq{font-size:14.5px;line-height:1.6;color:#1f2937;font-weight:600;margin:8px 0}
  .ha{font-size:13.5px;line-height:1.85;color:#64748b}
  .ha .yours{color:#dc2626;font-weight:700}
  .ha .right{color:#16a34a;font-weight:700}

  .primary-sm{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;border:none;border-radius:11px;
              padding:11px 20px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;
              box-shadow:0 6px 16px rgba(59,130,246,.3)}
  .primary-sm:active{transform:scale(.97)}
  .ghost-sm{background:#fff;border:1px solid #dbe2ef;color:#64748b;border-radius:11px;
            padding:11px 16px;font-size:13.5px;cursor:pointer;font-family:inherit}
  .ghost-sm:active{transform:scale(.97)}

  /* ================= 夜间模式 ================= */
  body.dark{background:linear-gradient(180deg,#0f172a 0%,#0b1220 260px,#0b1220 100%);color:#e2e8f0}
  body.dark .topbar.collapsed .topbar-mini{background:#1e293b;border-color:#334155;color:#cbd5e1;
                                          box-shadow:0 4px 14px rgba(0,0,0,.35)}
  body.dark .mini-mode{color:#93c5fd}
  body.dark .mini-prog{color:#94a3b8}
  body.dark .mini-expand{color:#60a5fa}
  body.dark h1{color:#f1f5f9}
  body.dark .sub{color:#94a3b8}
  body.dark .ghost{background:#1e293b;border-color:#334155;color:#cbd5e1}
  body.dark .ghost:hover{border-color:#475569;color:#e2e8f0}
  body.dark .ghost.hl{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;border-color:transparent}
  body.dark .ghost.icon{color:#94a3b8}
  body.dark .ghost.icon:hover{border-color:#3b82f6;color:#93c5fd}
  body.dark .modes button{background:#1e293b;border-color:#334155;color:#cbd5e1}
  body.dark .modes button.active{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;border-color:transparent}
  body.dark .stat{background:#1e293b;border-color:#334155}
  body.dark .stat b{color:#e2e8f0}
  body.dark .stat span{color:#94a3b8}
  body.dark .stat.ok b{color:#4ade80}
  body.dark .stat.bad b{color:#f87171}
  body.dark .progress{background:#1e293b}
  body.dark .card{background:#1e293b;border-color:#334155;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  body.dark .tag{background:#1e3a5f;color:#93c5fd}
  body.dark .tag.judge{background:#4a2f0a;color:#fbbf24}
  body.dark .qno{color:#64748b}
  body.dark .qtext{color:#f1f5f9}
  body.dark .opt{background:#0f172a;border-color:#334155;color:#e2e8f0}
  body.dark .opt:hover{border-color:#3b82f6;background:#1e293b}
  body.dark .opt .letter{background:#1e3a5f;color:#93c5fd}
  body.dark .opt.right{border-color:#22c55e;background:#052e16}
  body.dark .opt.right .letter{background:#22c55e;color:#fff}
  body.dark .opt.wrong{border-color:#ef4444;background:#450a0a}
  body.dark .opt.wrong .letter{background:#ef4444;color:#fff}
  body.dark .feedback.ok{color:#4ade80}
  body.dark .feedback.bad{color:#f87171}
  body.dark .hint{color:#64748b}
  body.dark .navbar{background:rgba(15,23,42,.94);border-top-color:#334155}
  body.dark .nav-btn{background:#1e293b;border-color:#334155;color:#cbd5e1}
  body.dark .nav-btn.primary{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;border-color:transparent}
  body.dark .jump input{background:#0f172a;border-color:#334155;color:#e2e8f0}
  body.dark .jump input::placeholder{color:#475569}
  body.dark .jump button{background:#1e293b;border-color:#334155;color:#cbd5e1}
  body.dark .empty{color:#cbd5e1}
  body.dark .empty span{color:#64748b}

  body.dark .hpanel{background:#0b1220}
  body.dark .hp-head{background:#1e293b;border-bottom-color:#334155}
  body.dark .hp-head h2{color:#f1f5f9}
  body.dark .hp-head .sub2{color:#64748b}
  body.dark .hp-back,body.dark .hp-close{background:#334155;color:#cbd5e1}
  body.dark .hp-tabs{background:#1e293b;border-bottom-color:#334155}
  body.dark .hp-tabs button{background:#0f172a;border-color:#334155;color:#cbd5e1}
  body.dark .hp-tabs button.active{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;border-color:transparent}
  body.dark .hp-foot{background:#1e293b;border-top-color:#334155}
  body.dark .session-card{background:#1e293b;border-color:#334155}
  body.dark .session-card.live{border-color:#3b82f6;background:linear-gradient(180deg,#1e3a5f,#1e293b)}
  body.dark .hname{color:#f1f5f9}
  body.dark .hname-input{background:#0f172a;color:#f1f5f9;border-color:#3b82f6}
  body.dark .sc-mode{color:#94a3b8}
  body.dark .hitem{background:#1e293b;border-color:#334155}
  body.dark .hq{color:#e2e8f0}
  body.dark .ha{color:#94a3b8}
  body.dark .ghost-sm{background:#1e293b;border-color:#334155;color:#cbd5e1}

  @media(max-width:420px){
    .qtext{font-size:15.5px}
    .opt{font-size:14.5px;padding:11px 12px}
    .jump input{width:52px}
    .ghost{padding:7px 8px;font-size:12px}
    .ghost.icon{padding:7px 8px}
    h1{font-size:15px}
    .sub{font-size:11px}
    .hname{font-size:14.5px}
    .mini-rate{font-size:12.5px}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== 顶部区域（可收起） ===== -->
  <div class="topbar" id="topbar">
    <div class="topbar-full">
      <header>
        <div class="brand">
          <span class="logo">⚡</span>
          <div style="min-width:0">
            <h1>电工四级理论题库</h1>
            <p class="sub">单选 187 题 · 判断 48 题</p>
          </div>
        </div>
        <div class="head-btns">
          <button class="ghost hl" id="histBtn">历史记录</button>
          <button class="ghost" id="redoBtn">新练习</button>
          <button class="ghost" id="clearBtn">清空</button>
          <button class="ghost icon" id="themeBtn" title="夜间模式">🌙</button>
          <button class="ghost icon" id="collapseBtn" title="收起顶部">▲</button>
        </div>
      </header>

      <div class="modes" id="modes">
        <button data-mode="all" class="active">全部练习</button>
        <button data-mode="single">单选题</button>
        <button data-mode="judge">判断题</button>
        <button data-mode="random">随机练习</button>
        <button data-mode="wrong">错题重练 <span class="badge" id="wrongBadge">0</span></button>
      </div>

      <div class="statsbar">
        <div class="stat"><b id="statDone">0</b><span>已答</span></div>
        <div class="stat ok"><b id="statRight">0</b><span>正确</span></div>
        <div class="stat bad"><b id="statWrong">0</b><span>错误</span></div>
        <div class="stat"><b id="statRate">0%</b><span>正确率</span></div>
      </div>
      <div class="progress"><i id="progressBar"></i></div>
    </div>

    <!-- 收起后的紧凑栏 -->
    <div class="topbar-mini" id="topbarMini" title="点击展开顶部">
      <span class="mini-icon">⚡</span>
      <span class="mini-mode" id="miniMode">全部练习</span>
      <span class="mini-prog" id="miniProg">第 1 / 187 题</span>
      <span class="mini-rate" id="miniRate">未作答</span>
      <span class="mini-expand">展开 ▼</span>
    </div>
  </div>

  <main id="card" class="card"></main>
</div>

<div class="navbar">
  <button class="nav-btn" id="prevBtn">← 上一题</button>
  <div class="jump">
    <input id="jumpInput" type="number" min="1" placeholder="#">
    <button id="jumpBtn">跳转</button>
  </div>
  <button class="nav-btn primary" id="nextBtn">下一题 →</button>
</div>

<!-- ===== 历史记录面板 ===== -->
<div class="hpanel" id="hpanel">
  <div class="hp-head">
    <button class="hp-back" id="hpBack" style="display:none">←</button>
    <div class="hp-title-wrap">
      <h2 id="hpTitle">历史记录</h2>
      <p class="sub2" id="hpSub"></p>
    </div>
    <button class="hp-close" id="hpClose">✕</button>
  </div>
  <div class="hp-tabs" id="hpTabs" style="display:none">
    <button id="htWrong" class="active">错题 0</button>
    <button id="htAll">全部 0</button>
  </div>
  <div class="hp-body" id="hlist"></div>
  <div class="hp-foot" id="hpFoot"></div>
</div>

<script>
/* ================== 题库数据 ================== */
const SINGLE = [
[1,"电工职业守则中强调的遵纪守法不包括（　）的要求。",["国家法律","企业内部纪律","地方风俗习惯","行业规范"],"C"],
[2,"关于职业幸福感，它通常是建立在员工对（　）的理解和接受基础上。",["工作报酬","公司福利","职业生涯","职业责任"],"D"],
[3,"软启动器能够减少启动时产生的（　），从而保护电机和相关设备。",["振动","噪声","冲击电流","温度升高"],"C"],

/* ================== 构建题库 ================== */
const BANK = [];
SINGLE.forEach(function(it){
  BANK.push({no:it[0],type:'single',q:it[1],o:it[2],a:'ABCD'.indexOf(it[3])});
});
JUDGE.forEach(function(it){
  BANK.push({no:it[0],type:'judge',q:it[1],o:['正确','错误'],a:it[2]==='A'?0:1});
});
BANK.sort(function(x,y){return x.no-y.no;});

const BY_NO = {};
BANK.forEach(function(it){ BY_NO[it.no] = it; });

const MODE_NAMES = {
  all:'全部练习', single:'单选题', judge:'判断题', random:'随机练习', wrong:'错题重练'
};

/* ================== 存储 ================== */
const LS_SESSIONS = 'dg4_sessions_v2';
const LS_THEME = 'dg4_theme_v1';
const state = {
  mode:'all',
  queue:[],
  pos:0,
  sessions:[],
  currentId:null,
  histView:'list',
  histSessionId:null,
  histDetailTab:'wrong'
};

function loadSessions(){
  try{
    var raw = localStorage.getItem(LS_SESSIONS);
    if(raw){
      var d = JSON.parse(raw);
      state.sessions = Array.isArray(d.sessions) ? d.sessions : [];
      state.currentId = d.currentId || null;
    }
  }catch(e){ state.sessions = []; state.currentId = null; }
  if(!state.sessions.length){ state.currentId = null; }
}
function saveSessions(){
  try{
    localStorage.setItem(LS_SESSIONS, JSON.stringify({
      sessions: state.sessions,
      currentId: state.currentId
    }));
  }catch(e){}
}

/* ================== 会话 ================== */
function getSession(id){
  for(var i=0;i<state.sessions.length;i++){
    if(state.sessions[i].id === id) return state.sessions[i];
  }
  return null;
}
function getCurrentSession(){
  var s = getSession(state.currentId);
  if(!s){ s = createSession(state.mode); }
  return s;
}
function createSession(mode, name){
  var s = {
    id: 's' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    name: name || ('第' + (state.sessions.length + 1) + '次练习'),
    mode: mode,
    createdAt: Date.now(),
    updatedAt: Date.now(),
    answers: {}
  };
  state.sessions.push(s);
  state.currentId = s.id;
  saveSessions();
  return s;
}
function sessionForMode(mode){
  for(var i=state.sessions.length-1;i>=0;i--){
    if(state.sessions[i].mode === mode) return state.sessions[i];
  }
  return null;
}
function sessionStats(s){
  var total=0, right=0, wrong=0;
  Object.keys(s.answers).forEach(function(no){
    var item = BY_NO[no];
    if(!item) return;
    total++;
    if(s.answers[no].c === item.a) right++; else wrong++;
  });
  return {total:total, right:right, wrong:wrong};
}
function computeWrongSet(){
  var last = {};
  state.sessions.forEach(function(s){
    Object.keys(s.answers).forEach(function(no){
      var a = s.answers[no];
      if(!last[no] || a.t > last[no].t) last[no] = a;
    });
  });
  var set = new Set();
  Object.keys(last).forEach(function(no){
    var item = BY_NO[no];
    if(item && last[no].c !== item.a) set.add(Number(no));
  });
  return set;
}

/* ================== 工具 ================== */
const $ = function(id){return document.getElementById(id);};
const card = $('card');

function esc(s){
  return String(s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}
function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=arr[i];arr[i]=arr[j];arr[j]=t;
  }
  return arr;
}
function fmtTime(t){
  var d = new Date(t);
  var p = function(n){ return String(n).padStart(2,'0'); };
  var now = new Date();
  var sameDay = d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();
  if(sameDay) return '今天 ' + p(d.getHours()) + ':' + p(d.getMinutes());
  return (d.getMonth()+1) + '月' + d.getDate() + '日 ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function optLabel(item, i){
  return (item.type==='judge' ? '' : 'ABCD'[i] + '. ') + item.o[i];
}

/* ================== 主题切换 ================== */
function applyTheme(dark){
  document.body.classList.toggle('dark', !!dark);
  var btn = $('themeBtn');
  if(btn){
    btn.textContent = dark ? '☀️' : '🌙';
    btn.title = dark ? '白天模式' : '夜间模式';
    btn.setAttribute('aria-label', dark ? '切换到白天模式' : '切换到夜间模式');
  }
}
function loadTheme(){
  try{
    var v = localStorage.getItem(LS_THEME);
    if(v === 'dark') return true;
    if(v === 'light') return false;
  }catch(e){}
  // 未设置过：跟随系统
  try{
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }catch(e){ return false; }
}
function saveTheme(dark){
  try{ localStorage.setItem(LS_THEME, dark ? 'dark' : 'light'); }catch(e){}
}
function toggleTheme(){
  var dark = !document.body.classList.contains('dark');
  applyTheme(dark);
  saveTheme(dark);
}

/* ================== 队列 ================== */
function buildQueue(mode){
  var all = BANK.map(function(_,i){return i;});
  if(mode==='single') return all.filter(function(i){return BANK[i].type==='single';});
  if(mode==='judge')  return all.filter(function(i){return BANK[i].type==='judge';});
  if(mode==='wrong'){
    var ws = computeWrongSet();
    return all.filter(function(i){return ws.has(BANK[i].no);});
  }
  if(mode==='random') return shuffle(all);
  return all;
}

/* ================== 顶部收起 ================== */
function collapseTopbar(){
  $('topbar').classList.add('collapsed');
  updateMiniBar();
}
function expandTopbar(){
  $('topbar').classList.remove('collapsed');
}

function updateMiniBar(){
  var sess = getCurrentSession();
  var done = 0, right = 0;
  state.queue.forEach(function(i){
    var it = BANK[i], rec = sess.answers[it.no];
    if(rec !== undefined){ done++; if(rec.c === it.a) right++; }
  });
  $('miniMode').textContent = MODE_NAMES[state.mode] || '练习';
  $('miniProg').textContent = state.queue.length
    ? ('第 ' + (state.pos + 1) + ' / ' + state.queue.length + ' 题')
    : '暂无题目';
  var rateEl = $('miniRate');
  if(done === 0){
    rateEl.textContent = '未作答';
    rateEl.style.color = '#94a3b8';
  }else{
    var rate = Math.round(right / done * 100);
    rateEl.textContent = '已答 ' + done + ' · 正确 ' + rate + '%';
    rateEl.style.color = rate >= 60 ? '#16a34a' : '#dc2626';
  }
}

/* ================== 答题卡 ================== */
function currentItem(){ return BANK[state.queue[state.pos]]; }

function render(){
  var sess = getCurrentSession();

  if(state.queue.length===0){
    card.innerHTML = '<div class="empty">🎉 当前分组没有题目<br><span>' +
      (state.mode==='wrong' ? '错题本是空的，先去「全部练习」刷题吧' : '请切换其他分组') +
      '</span></div>';
    updateStats();
    updateNav();
    return;
  }

  var item = currentItem();
  var rec = sess.answers[item.no];
  var answered = (rec !== undefined);
  var chosen = answered ? rec.c : undefined;

  card.innerHTML =
    '<div class="qhead">' +
      '<span class="tag ' + (item.type==='judge'?'judge':'') + '">' +
        (item.type==='single'?'单选题':'判断题') + '</span>' +
      '<span class="qno">第 ' + (state.pos+1) + ' / ' + state.queue.length +
        ' 题 · 题库 No.' + item.no + '</span>' +
    '</div>' +
    '<div class="qtext">' + esc(item.q) + '</div>' +
    '<div class="opts" id="opts"></div>' +
    '<div class="feedback" id="fb"></div>';

  var optsEl = $('opts');
  item.o.forEach(function(text,i){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt';
    b.innerHTML = '<span class="letter">' + 'ABCD'[i] + '</span><span>' + esc(text) + '</span>';
    if(answered){
      b.classList.add('locked');
      if(i===item.a) b.classList.add('right');
      else if(i===chosen) b.classList.add('wrong');
    }else{
      b.addEventListener('click', function(){ choose(i); });
    }
    optsEl.appendChild(b);
  });

  var fb = $('fb');
  if(answered){
    if(chosen===item.a){
      fb.className = 'feedback ok';
      fb.innerHTML = '<b>✓ 回答正确</b>　正确答案：' + optLabel(item, item.a);
    }else{
      fb.className = 'feedback bad';
      fb.innerHTML = '<b>✗ 回答错误</b>　正确答案：' + optLabel(item, item.a) +
                     '　（你选了 ' + optLabel(item, chosen) + '）';
    }
  }else{
    fb.className = 'feedback';
    fb.innerHTML = '<span class="hint">点击选项作答 · 键盘 A/B/C/D 或 1-4 也可作答</span>';
  }

  updateStats();
  updateNav();
}

function updateStats(){
  var sess = getCurrentSession();
  var done=0, right=0;
  state.queue.forEach(function(i){
    var it = BANK[i], rec = sess.answers[it.no];
    if(rec !== undefined){ done++; if(rec.c === it.a) right++; }
  });
  var wrongN = done - right;
  $('statDone').textContent = done;
  $('statRight').textContent = right;
  $('statWrong').textContent = wrongN;
  $('statRate').textContent = done ? Math.round(right/done*100)+'%' : '0%';
  $('progressBar').style.width = (state.queue.length ? (done/state.queue.length*100) : 0) + '%';
  $('wrongBadge').textContent = computeWrongSet().size;
  updateMiniBar();
}

function updateNav(){
  $('prevBtn').disabled = state.pos<=0;
  $('nextBtn').disabled = state.pos>=state.queue.length-1;
}

/* ================== 交互 ================== */
function choose(i){
  if(state.queue.length===0) return;
  var item = currentItem();
  var sess = getCurrentSession();
  if(sess.answers[item.no] !== undefined) return;

  sess.answers[item.no] = { c:i, t:Date.now() };
  sess.updatedAt = Date.now();
  saveSessions();

  render();
  if($('hpanel').classList.contains('show')) renderHistory();
}

function next(){
  if(state.pos < state.queue.length-1){ state.pos++; render(); }
}
function prev(){
  if(state.pos > 0){ state.pos--; render(); }
}

function updateModeButtons(){
  Array.prototype.forEach.call(document.querySelectorAll('.modes button'), function(b){
    b.classList.toggle('active', b.dataset.mode === state.mode);
  });
}

function switchMode(mode){
  state.mode = mode;
  var s = sessionForMode(mode);
  if(!s) s = createSession(mode);
  state.currentId = s.id;
  state.queue = buildQueue(mode);

  var idx = 0;
  for(var i=0;i<state.queue.length;i++){
    var no = BANK[state.queue[i]].no;
    if(s.answers[no] === undefined){ idx = i; break; }
    if(i === state.queue.length-1) idx = i;
  }
  state.pos = idx;

  saveSessions();
  updateModeButtons();
  render();
}

/* ================== 历史记录面板 ================== */
function openHistory(){
  state.histView = 'list';
  state.histSessionId = null;
  renderHistory();
  $('hpanel').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeHistory(){
  $('hpanel').classList.remove('show');
  document.body.style.overflow = '';
}
function renderHistory(){
  if(state.histView === 'detail') renderSessionDetail();
  else renderSessionList();
}

function renderSessionList(){
  $('hpBack').style.display = 'none';
  $('hpTabs').style.display = 'none';
  $('hpTitle').textContent = '历史记录';

  var list = state.sessions.filter(function(s){
    return Object.keys(s.answers).length > 0 || s.id === state.currentId;
  }).sort(function(a,b){ return b.updatedAt - a.updatedAt; });

  $('hpSub').textContent = list.length ? ('共 ' + list.length + ' 次练习记录') : '暂无记录';

  var box = $('hlist');
  if(list.length === 0){
    box.innerHTML = '<div class="empty">暂无练习记录<br><span>去练习吧，每次作答都会自动保存为一条记录</span></div>';
    $('hpFoot').innerHTML = '';
    return;
  }

  box.innerHTML = list.map(function(s){
    var stat = sessionStats(s);
    var isLive = (s.id === state.currentId);
    return '<div class="session-card ' + (isLive?'live':'') + '" data-id="' + s.id + '">' +
      '<div class="sc-top">' +
        '<div class="hname-wrap">' +
          '<span class="hname" data-id="' + s.id + '" title="点击修改名称">' + esc(s.name) + '</span>' +
          (isLive ? '<span class="live-badge">正在练习中</span>' : '') +
        '</div>' +
        '<span class="sc-time">' + fmtTime(s.updatedAt) + '</span>' +
      '</div>' +
      '<div class="sc-mode">' + (MODE_NAMES[s.mode] || s.mode) + '</div>' +
      '<div class="sc-stats">' +
        '<span class="ok-t">✓ 正确 ' + stat.right + '</span>' +
        '<span class="bad-t">✗ 错误 ' + stat.wrong + '</span>' +
        '<span class="tot-t">共 ' + stat.total + ' 题</span>' +
      '</div>' +
    '</div>';
  }).join('');

  $('hpFoot').innerHTML =
    '<button class="ghost-sm" id="hpClearAll">清空全部历史</button>';
}

function renderSessionDetail(){
  var s = getSession(state.histSessionId);
  if(!s){ state.histView='list'; renderHistory(); return; }

  var stat = sessionStats(s);
  $('hpBack').style.display = 'block';
  $('hpTitle').textContent = s.name;
  $('hpSub').textContent = (MODE_NAMES[s.mode] || s.mode) + ' · 正确 ' +
    stat.right + ' / 错误 ' + stat.wrong + ' / 共 ' + stat.total + ' 题';

  $('hpTabs').style.display = 'flex';
  $('htWrong').textContent = '错题 ' + stat.wrong;
  $('htAll').textContent = '全部 ' + stat.total;
  $('htWrong').classList.toggle('active', state.histDetailTab==='wrong');
  $('htAll').classList.toggle('active', state.histDetailTab==='all');

  if(stat.wrong > 0){
    $('hpFoot').innerHTML =
      '<button class="primary-sm" id="hpReview">重新练习错题 (' + stat.wrong + ')</button>' +
      '<button class="ghost-sm" id="hpClearAll">清空全部历史</button>';
  }else{
    $('hpFoot').innerHTML =
      '<span class="hint" style="font-size:13px">本次练习没有错题 🎉</span>' +
      '<button class="ghost-sm" id="hpClearAll">清空全部历史</button>';
  }

  var entries = [];
  Object.keys(s.answers).forEach(function(no){
    var item = BY_NO[no];
    if(!item) return;
    var rec = s.answers[no];
    var ok = rec.c === item.a;
    if(state.histDetailTab === 'wrong' && ok) return;
    entries.push({it:item, rec:rec, ok:ok});
  });
  entries.sort(function(a,b){ return a.it.no - b.it.no; });

  var box = $('hlist');
  if(entries.length === 0){
    box.innerHTML = '<div class="empty">' +
      (state.histDetailTab==='wrong' ? '本次练习没有错题 🎉' : '暂无作答记录') +
      '</div>';
    return;
  }

  box.innerHTML = entries.map(function(x){
    return '<div class="hitem">' +
      '<div class="hrow">' +
        '<span class="tag ' + (x.it.type==='judge'?'judge':'') + '">' +
          (x.it.type==='single'?'单选题':'判断题') + '</span>' +
        '<span class="hno">No.' + x.it.no + '</span>' +
      '</div>' +
      '<div class="hq">' + esc(x.it.q) + '</div>' +
      '<div class="ha">你的答案：<span class="' + (x.ok?'right':'yours') + '">' +
        esc(optLabel(x.it, x.rec.c)) + '</span></div>' +
      (x.ok ? '' : '<div class="ha">正确答案：<span class="right">' +
        esc(optLabel(x.it, x.it.a)) + '</span></div>') +
    '</div>';
  }).join('');
}

function reviewSessionWrong(sessionId){
  var s = getSession(sessionId);
  if(!s) return;

  var wrongNos = [];
  Object.keys(s.answers).forEach(function(no){
    var item = BY_NO[no];
    if(item && s.answers[no].c !== item.a) wrongNos.push(Number(no));
  });
  if(wrongNos.length === 0) return;

  var ns = createSession('wrong', s.name + ' · 错题重练');
  state.mode = 'wrong';

  var idxs = [];
  wrongNos.forEach(function(no){
    for(var i=0;i<BANK.length;i++){
      if(BANK[i].no === no){ idxs.push(i); break; }
    }
  });
  state.queue = idxs;
  state.pos = 0;
  state.currentId = ns.id;
  saveSessions();

  closeHistory();
  updateModeButtons();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function startRename(el){
  var id = el.dataset.id;
  var s = getSession(id);
  if(!s) return;

  var input = document.createElement('input');
  input.type = 'text';
  input.className = 'hname-input';
  input.value = s.name;
  input.maxLength = 30;

  el.replaceWith(input);
  input.focus();
  input.select();

  var done = false;
  function commit(){
    if(done) return;
    done = true;
    var v = input.value.trim();
    if(v) s.name = v;
    saveSessions();
    renderHistory();
  }
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', function(ev){
    if(ev.key === 'Enter'){ ev.preventDefault(); input.blur(); }
    else if(ev.key === 'Escape'){ input.value = s.name; input.blur(); }
    ev.stopPropagation();
  });
}

/* ================== 事件绑定 ================== */
$('modes').addEventListener('click', function(e){
  var btn = e.target.closest('button[data-mode]');
  if(btn) switchMode(btn.dataset.mode);
});
$('prevBtn').addEventListener('click', prev);
$('nextBtn').addEventListener('click', next);
$('jumpBtn').addEventListener('click', function(){
  var v = parseInt($('jumpInput').value,10);
  if(!isNaN(v) && v>=1 && v<=state.queue.length){
    state.pos = v-1;
    render();
    $('jumpInput').value = '';
  }
});
$('jumpInput').addEventListener('keydown', function(e){
  if(e.key==='Enter') $('jumpBtn').click();
});

/* 收起 / 展开 */
$('collapseBtn').addEventListener('click', function(e){
  e.stopPropagation();
  collapseTopbar();
});
$('topbarMini').addEventListener('click', function(){
  expandTopbar();
});

/* 夜间模式 */
$('themeBtn').addEventListener('click', function(e){
  e.stopPropagation();
  toggleTheme();
});

/* 新练习 */
$('redoBtn').addEventListener('click', function(){
  var cur = getCurrentSession();
  var n = Object.keys(cur.answers).length;
  if(n > 0 && !confirm('开始一次新的练习？当前进度会保存到「历史记录」。')) return;
  createSession(state.mode);
  state.queue = buildQueue(state.mode);
  state.pos = 0;
  saveSessions();
  render();
});

/* 清空 */
$('clearBtn').addEventListener('click', function(){
  if(confirm('确定要清空全部练习记录吗？此操作不可恢复。')){
    state.sessions = [];
    state.currentId = null;
    saveSessions();
    createSession(state.mode);
    state.queue = buildQueue(state.mode);
    state.pos = 0;
    saveSessions();
    render();
    if($('hpanel').classList.contains('show')){
      state.histView='list'; state.histSessionId=null;
      renderHistory();
    }
  }
});

/* 历史面板 */
$('histBtn').addEventListener('click', openHistory);
$('hpClose').addEventListener('click', closeHistory);
$('hpBack').addEventListener('click', function(){
  state.histView = 'list';
  state.histSessionId = null;
  renderHistory();
});
$('htWrong').addEventListener('click', function(){
  state.histDetailTab='wrong'; renderSessionDetail();
});
$('htAll').addEventListener('click', function(){
  state.histDetailTab='all'; renderSessionDetail();
});

$('hlist').addEventListener('click', function(e){
  var nameEl = e.target.closest('.hname');
  if(nameEl){
    e.preventDefault(); e.stopPropagation();
    startRename(nameEl);
    return;
  }
  var cardEl = e.target.closest('.session-card');
  if(cardEl){
    state.histView = 'detail';
    state.histSessionId = cardEl.dataset.id;
    state.histDetailTab = 'wrong';
    renderHistory();
    $('hlist').scrollTop = 0;
    return;
  }
});

$('hpFoot').addEventListener('click', function(e){
  if(e.target.closest('#hpReview')){
    reviewSessionWrong(state.histSessionId);
    return;
  }
  if(e.target.closest('#hpClearAll')){
    if(confirm('确定要清空全部练习记录吗？此操作不可恢复。')){
      state.sessions = [];
      state.currentId = null;
      createSession(state.mode);
      state.queue = buildQueue(state.mode);
      state.pos = 0;
      saveSessions();
      state.histView = 'list';
      state.histSessionId = null;
      renderHistory();
      render();
    }
  }
});

/* 键盘 */
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && $('hpanel').classList.contains('show')){
    if(state.histView === 'detail'){
      state.histView = 'list';
      state.histSessionId = null;
      renderHistory();
    }else{
      closeHistory();
    }
    return;
  }
  if(e.target.tagName==='INPUT') return;
  if(state.queue.length===0) return;
  if($('hpanel').classList.contains('show')) return;

  var item = currentItem();
  var k = e.key.toUpperCase();
  if(k.length===1 && 'ABCD'.indexOf(k)>=0){
    var i1 = 'ABCD'.indexOf(k);
    if(i1 < item.o.length){ choose(i1); e.preventDefault(); }
  }else if(k.length===1 && '1234'.indexOf(k)>=0){
    var i2 = parseInt(k,10)-1;
    if(i2 < item.o.length){ choose(i2); e.preventDefault(); }
  }else if(e.key==='ArrowRight'){
    next();
  }else if(e.key==='ArrowLeft'){
    prev();
  }
});

/* ================== 启动 ================== */
loadSessions();
applyTheme(loadTheme());
switchMode('all');
</script>
</body>
</html>
