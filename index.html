<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>电工四级理论题库 · 在线练习</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
background:linear-gradient(180deg,#eef2ff 0%,#f6f8fc 260px,#f6f8fc 100%);color:#1f2937;min-height:100vh;
transition:background .3s ease,color .3s ease;-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:14px 12px 110px;padding-left:calc(12px + env(safe-area-inset-left));padding-right:calc(12px + env(safe-area-inset-right))}
.topbar{margin-bottom:14px}
.topbar-mini{display:none}
.topbar.collapsed .topbar-full{display:none}
.topbar.collapsed .topbar-mini{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e8edf6;border-radius:14px;padding:11px 14px;cursor:pointer;box-shadow:0 4px 14px rgba(15,23,42,.06);font-size:13.5px;color:#334155;transition:.15s}
.topbar.collapsed .topbar-mini:active{transform:scale(.99)}
.mini-icon{font-size:16px;line-height:1;flex:0 0 auto}
.mini-mode{font-weight:700;color:#1e40af;flex:0 0 auto}
.mini-prog{color:#64748b;flex:0 0 auto}
.mini-rate{color:#94a3b8;flex:1;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-expand{color:#2563eb;font-weight:700;flex:0 0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 2px 14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#3b82f6,#6366f1);display:grid;place-items:center;font-size:20px;box-shadow:0 6px 14px rgba(59,130,246,.35);flex:0 0 auto}
h1{font-size:17px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#111827}
.head-btns{display:flex;gap:5px;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end}
.ghost{background:#fff;border:1px solid #dbe2ef;color:#475569;padding:8px 10px;border-radius:10px;font-size:12.5px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.18s}
.ghost:active{transform:scale(.96)}
.ghost.hl{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;border-color:transparent;box-shadow:0 6px 14px rgba(59,130,246,.3)}
.ghost.icon{padding:8px 9px;line-height:1;font-size:13px;color:#64748b}
.ghost.icon:hover{border-color:#bfd3f8;color:#2563eb}
#themeBtn{font-size:15px;padding:7px 9px;line-height:1}
.modes{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.modes::-webkit-scrollbar{display:none}
.modes button{flex:0 0 auto;padding:9px 14px;border-radius:999px;border:1px solid #dbe2ef;background:#fff;color:#475569;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:.18s;font-family:inherit}
.modes button.active{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;border-color:transparent;box-shadow:0 6px 14px rgba(59,130,246,.3)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:#ef4444;color:#fff;font-size:11px;line-height:18px;text-align:center;vertical-align:1px}
.statsbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.stat{background:#fff;border-radius:12px;padding:8px 4px;text-align:center;border:1px solid #e8edf6}
.stat b{display:block;font-size:17px;line-height:1.35}
.stat span{font-size:11.5px;color:#94a3b8}
.stat.ok b{color:#16a34a}
.stat.bad b{color:#dc2626}
.progress{height:7px;border-radius:99px;background:#e2e8f4;overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#3b82f6,#6366f1);transition:width .25s}
.card{background:#fff;border-radius:18px;padding:18px 16px;box-shadow:0 10px 30px rgba(15,23,42,.07);border:1px solid #eef2f9;min-height:240px;position:relative;touch-action:pan-y}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;padding:3px 10px;border-radius:8px;background:#eef4ff;color:#2563eb;font-weight:600}
.tag.judge{background:#fff4e6;color:#d97706}
.tag.shuffled{background:#f3e8ff;color:#9333ea}
.qno{font-size:12px;color:#94a3b8}
.qtext{font-size:16.5px;line-height:1.68;font-weight:600;margin-bottom:16px;color:#111827;word-wrap:break-word;overflow-wrap:break-word}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid #e5eaf3;background:#fbfcff;font-size:15px;line-height:1.5;color:#1f2937;cursor:pointer;transition:.15s;font-family:inherit;word-wrap:break-word;overflow-wrap:break-word}
.opt:hover{border-color:#bfd3f8;background:#f3f7ff}
.opt:active{transform:scale(.985)}
.opt .letter{flex:0 0 24px;height:24px;border-radius:7px;background:#eaf0fb;color:#4b6b9e;display:grid;place-items:center;font-size:13px;font-weight:700}
.opt.right{border-color:#16a34a;background:#f0fdf4}
.opt.right .letter{background:#16a34a;color:#fff}
.opt.wrong{border-color:#dc2626;background:#fef2f2}
.opt.wrong .letter{background:#dc2626;color:#fff}
.opt.locked{cursor:default}
.feedback{margin-top:14px;font-size:14px;min-height:22px;line-height:1.6}
.feedback.ok{color:#16a34a}
.feedback.bad{color:#dc2626}
.fb-line{margin-bottom:2px}
.explain{margin-top:14px;border-radius:14px;overflow:hidden;border:1px solid #e3ebf9;background:#fff;box-shadow:0 4px 16px rgba(59,130,246,.08);animation:fadeIn .28s ease}
.explain.ok{border-color:#c8ecd4;box-shadow:0 4px 16px rgba(22,163,74,.10)}
.explain.bad{border-color:#f6d0d0;box-shadow:0 4px 16px rgba(220,38,38,.10)}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.exp-head{display:flex;align-items:center;gap:8px;padding:11px 14px;background:linear-gradient(135deg,#eef4ff,#f5f8ff);border-bottom:1px solid #e6eefc}
.explain.ok .exp-head{background:linear-gradient(135deg,#ecfdf3,#f6fef9);border-bottom-color:#d5f2de}
.explain.bad .exp-head{background:linear-gradient(135deg,#fef2f2,#fff7f7);border-bottom-color:#f9dcdc}
.exp-head-icon{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:14px;line-height:1;flex:0 0 auto;background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;box-shadow:0 2px 6px rgba(59,130,246,.3)}
.explain.ok .exp-head-icon{background:linear-gradient(135deg,#16a34a,#22c55e);box-shadow:0 2px 6px rgba(22,163,74,.3)}
.explain.bad .exp-head-icon{background:linear-gradient(135deg,#dc2626,#ef4444);box-shadow:0 2px 6px rgba(220,38,38,.3)}
.exp-head-title{font-size:13.5px;font-weight:700;color:#1e40af;letter-spacing:.3px}
.explain.ok .exp-head-title{color:#15803d}
.explain.bad .exp-head-title{color:#b91c1c}
.exp-head-status{margin-left:auto;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px;background:#dbeafe;color:#1d4ed8}
.explain.ok .exp-head-status{background:#dcfce7;color:#15803d}
.explain.bad .exp-head-status{background:#fee2e2;color:#b91c1c}
.exp-body{padding:13px 14px 15px}
.exp-block{margin-bottom:12px}
.exp-block:last-child{margin-bottom:0}
.exp-label{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;letter-spacing:.6px;color:#4f6bed;margin-bottom:6px;padding:2px 8px;border-radius:6px;background:#eef4ff}
.exp-label::before{content:'';width:3px;height:11px;border-radius:2px;background:#3b82f6}
.explain.ok .exp-label{color:#15803d;background:#eafaf0}
.explain.ok .exp-label::before{background:#16a34a}
.explain.bad .exp-label{color:#b91c1c;background:#fef0f0}
.explain.bad .exp-label::before{background:#dc2626}
.exp-block p{margin:0;font-size:13.5px;line-height:1.78;color:#475569;word-wrap:break-word;overflow-wrap:break-word}
.k-main{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;font-weight:600;color:#334155;align-items:center}
.k-chip{display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#ede9fe,#ddd6fe);color:#6d28d9;border:1px solid #c4b5fd;transition:.15s;line-height:1.4}
.k-chip:hover{background:linear-gradient(135deg,#ddd6fe,#c4b5fd);transform:translateY(-1px)}
.k-chip .k-plus{font-size:10px;font-weight:900;opacity:.75}
.k-links{display:flex;flex-wrap:wrap;gap:6px}
.k-link{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;text-decoration:none;background:#eef4ff;color:#2563eb;border:1px solid #cfe0fc;transition:.15s;line-height:1.4}
.k-link:hover{background:#dbeafe;color:#1d4ed8;border-color:#93c5fd;transform:translateY(-1px)}
.k-link .k-arrow{font-size:10.5px;opacity:.7}
/* 逐选项分析 */
.exp-options{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.exp-option{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:#f8fafc;border-left:3px solid #cbd5e1;font-size:13px;line-height:1.65;color:#64748b}
.exp-option .opt-tag{flex:0 0 22px;height:22px;font-weight:800;font-size:12.5px;display:grid;place-items:center;border-radius:6px;background:#e2e8f4;color:#475569}
.exp-option .opt-content{flex:1;min-width:0}
.exp-option .opt-text{font-weight:600;color:#334155;margin-bottom:3px;word-wrap:break-word;overflow-wrap:break-word}
.exp-option .opt-analysis{color:#64748b;word-wrap:break-word;overflow-wrap:break-word}
.exp-option.is-right{background:#f0fdf4;border-left-color:#16a34a;color:#15803d}
.exp-option.is-right .opt-tag{background:#16a34a;color:#fff}
.exp-option.is-right .opt-text{color:#15803d}
.exp-option.is-right .opt-analysis{color:#166534}
.exp-option.is-wrong{background:#fef2f2;border-left-color:#ef4444;color:#b91c1c}
.exp-option.is-wrong .opt-tag{background:#ef4444;color:#fff}
.exp-option.is-wrong .opt-text{color:#b91c1c}
.exp-option.is-wrong .opt-analysis{color:#991b1b}
.hint{color:#9aa8bd;font-size:13px}
.sheet-toggle{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;padding:9px 14px;background:#f5f8ff;border:1px dashed #cfe0fc;border-radius:12px;color:#2563eb;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;width:100%}
.sheet-toggle:hover{background:#eef4ff;border-color:#93c5fd}
.sheet-toggle .arrow{font-size:10px;transition:.2s}
.sheet-toggle.open .arrow{transform:rotate(180deg)}
.answer-sheet{max-height:0;overflow:hidden;transition:max-height .3s ease;margin-top:0}
.answer-sheet.open{max-height:600px;margin-top:12px;overflow-y:auto}
.as-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:6px;padding:12px;background:#f8fafc;border-radius:12px;border:1px solid #e8edf6}
.as-cell{aspect-ratio:1;min-width:0;border-radius:8px;border:1.5px solid #e2e8f4;background:#fff;color:#64748b;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;display:grid;place-items:center;transition:.13s;padding:0}
.as-cell:active{transform:scale(.92)}
.as-cell.right{background:#dcfce7;border-color:#16a34a;color:#15803d}
.as-cell.wrong{background:#fee2e2;border-color:#dc2626;color:#b91c1c}
.as-cell.current{box-shadow:0 0 0 3px rgba(59,130,246,.35);border-color:#3b82f6;color:#1d4ed8}
.resume-bar{display:none;align-items:center;gap:10px;margin-bottom:12px;padding:11px 14px;border-radius:14px;background:linear-gradient(135deg,#fef3c7,#fde68a);border:1px solid #fbbf24;color:#78350f;font-size:13px;line-height:1.4;box-shadow:0 4px 14px rgba(251,191,36,.2)}
.resume-bar.show{display:flex}
.resume-bar .rb-icon{font-size:18px;flex:0 0 auto}
.resume-bar .rb-text{flex:1;min-width:0}
.resume-bar .rb-text b{font-weight:800}
.resume-bar .rb-btn{flex:0 0 auto;padding:6px 12px;border-radius:9px;border:none;background:#b45309;color:#fff;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.resume-bar .rb-close{flex:0 0 auto;width:24px;height:24px;border:none;background:transparent;color:#92400e;font-size:16px;line-height:1;cursor:pointer;font-family:inherit}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);max-width:88%;padding:10px 18px;border-radius:99px;background:rgba(15,23,42,.92);color:#fff;font-size:13.5px;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:200;text-align:center;backdrop-filter:blur(6px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.navbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid #e6ecf5;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;justify-content:center;z-index:50}
.nav-btn{flex:1;max-width:220px;padding:12px;border-radius:12px;border:1px solid #dbe2ef;background:#fff;color:#334155;font-size:15px;cursor:pointer;font-family:inherit}
.nav-btn.primary{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(59,130,246,.32)}
.nav-btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.jump{display:flex;gap:4px;align-items:center}
.jump input{width:70px;padding:10px 4px;border-radius:10px;border:1px solid #dbe2ef;text-align:center;font-size:14px;font-family:inherit;outline:none}
.jump button{padding:10px;border-radius:10px;border:1px solid #dbe2ef;background:#fff;color:#475569;font-size:13px;cursor:pointer;font-family:inherit}
.empty{text-align:center;padding:50px 10px;color:#475569;font-size:16px;line-height:2}
.empty span{font-size:13px;color:#94a3b8}
.hpanel{position:fixed;top:0;bottom:0;left:0;right:0;z-index:120;background:#f6f8fc;display:none;flex-direction:column;max-width:820px;margin:0 auto;box-shadow:0 0 60px rgba(15,23,42,.18)}
.hpanel.show{display:flex}
.hp-head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border-bottom:1px solid #e9eef7;padding-top:calc(12px + env(safe-area-inset-top))}
.hp-back{background:#f1f5fb;border:none;color:#475569;width:34px;height:34px;border-radius:10px;font-size:16px;cursor:pointer;line-height:1;font-family:inherit;flex:0 0 auto}
.hp-title-wrap{flex:1;min-width:0}
.hp-head h2{margin:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hp-head .sub2{margin:2px 0 0;font-size:11.5px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hp-close{background:#f1f5fb;border:none;color:#475569;width:34px;height:34px;border-radius:10px;font-size:15px;cursor:pointer;line-height:1;font-family:inherit;flex:0 0 auto}
.hp-tabs{display:flex;gap:8px;padding:10px 14px;background:#fff;border-bottom:1px solid #e9eef7}
.hp-tabs button{flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid #dbe2ef;background:#fff;color:#475569;font-size:13px;cursor:pointer;font-family:inherit}
.hp-tabs button.active{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;border-color:transparent}
.hp-body{flex:1;overflow-y:auto;padding:12px 12px 20px;-webkit-overflow-scrolling:touch}
.hp-foot{padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #e9eef7;display:flex;justify-content:center;gap:8px;align-items:center;flex-wrap:wrap}
.session-card{position:relative;background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;border:1.5px solid #eef2f9;box-shadow:0 4px 14px rgba(15,23,42,.05);cursor:pointer;transition:.15s}
.session-card.live{border-color:#93b4f7;background:linear-gradient(180deg,#f7faff,#fff)}
.sc-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.hname-wrap{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.hname{font-size:15.5px;font-weight:700;color:#111827;cursor:pointer}
.hname-input{font-size:15.5px;font-weight:700;font-family:inherit;color:#111827;border:1.5px solid #93b4f7;border-radius:8px;padding:2px 8px;outline:none;background:#fff;min-width:120px;max-width:200px}
.live-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#1d4ed8;background:#e3edff;border-radius:99px;padding:3px 9px;flex:0 0 auto}
.sc-time{font-size:11.5px;color:#94a3b8;flex:0 0 auto}
.sc-del{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:9px;border:none;background:#fee2e2;color:#dc2626;font-size:16px;line-height:1;cursor:pointer;font-family:inherit;display:grid;place-items:center;opacity:0}
@media(max-width:600px){.sc-del{opacity:.6}}
.sc-mode{font-size:12px;color:#64748b;margin-bottom:8px}
.sc-stats{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.sc-stats .ok-t{color:#16a34a;font-weight:700}
.sc-stats .bad-t{color:#dc2626;font-weight:700}
.sc-stats .tot-t{color:#94a3b8}
.hitem{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;border:1px solid #eef2f9;box-shadow:0 4px 12px rgba(15,23,42,.04)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hno{font-size:11.5px;color:#94a3b8}
.hq{font-size:14.5px;line-height:1.6;color:#1f2937;font-weight:600;margin:8px 0}
.ha{font-size:13.5px;line-height:1.85;color:#64748b}
.ha .yours{color:#dc2626;font-weight:700}
.ha .right{color:#16a34a;font-weight:700}
.primary-sm{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;border:none;border-radius:11px;padding:11px 20px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.ghost-sm{background:#fff;border:1px solid #dbe2ef;color:#64748b;border-radius:11px;padding:11px 16px;font-size:13.5px;cursor:pointer;font-family:inherit}
/* 夜间 */
body.dark{background:linear-gradient(180deg,#0f172a 0%,#0b1220 260px,#0b1220 100%);color:#e2e8f0}
body.dark .topbar.collapsed .topbar-mini{background:#1e293b;border-color:#334155;color:#cbd5e1}
body.dark .mini-mode{color:#93c5fd}
body.dark .mini-prog{color:#94a3b8}
body.dark .mini-expand{color:#60a5fa}
body.dark h1{color:#f1f5f9}
body.dark .ghost{background:#1e293b;border-color:#334155;color:#cbd5e1}
body.dark .ghost.hl{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;border-color:transparent}
body.dark .ghost.icon{color:#94a3b8}
body.dark .modes button{background:#1e293b;border-color:#334155;color:#cbd5e1}
body.dark .modes button.active{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;border-color:transparent}
body.dark .stat{background:#1e293b;border-color:#334155}
body.dark .stat b{color:#e2e8f0}
body.dark .stat span{color:#94a3b8}
body.dark .stat.ok b{color:#4ade80}
body.dark .stat.bad b{color:#f87171}
body.dark .progress{background:#1e293b}
body.dark .card{background:#1e293b;border-color:#334155;box-shadow:0 10px 30px rgba(0,0,0,.4)}
body.dark .tag{background:#1e3a5f;color:#93c5fd}
body.dark .tag.judge{background:#4a2f0a;color:#fbbf24}
body.dark .tag.shuffled{background:#3b0764;color:#d8b4fe}
body.dark .qno{color:#64748b}
body.dark .qtext{color:#f1f5f9}
body.dark .opt{background:#0f172a;border-color:#334155;color:#e2e8f0}
body.dark .opt:hover{border-color:#3b82f6;background:#1e293b}
body.dark .opt .letter{background:#1e3a5f;color:#93c5fd}
body.dark .opt.right{border-color:#22c55e;background:#052e16}
body.dark .opt.right .letter{background:#22c55e;color:#fff}
body.dark .opt.wrong{border-color:#ef4444;background:#450a0a}

<body>
<div class="wrap">
  <div class="topbar" id="topbar">
    <div class="topbar-full">
      <header>
        <div class="brand"><span class="logo">⚡</span><h1>电工四级理论题库</h1></div>
        <div class="head-btns">
          <button class="ghost hl" id="histBtn">历史记录</button>
          <button class="ghost" id="redoBtn">新练习</button>
          <button class="ghost" id="clearBtn">清空</button>
          <button class="ghost icon" id="themeBtn" title="夜间模式">🌙</button>
          <button class="ghost icon" id="collapseBtn" title="收起顶部">▲</button>
        </div>
      </header>
      <div class="modes" id="modes">
        <button data-mode="all" class="active">全部练习</button>
        <button data-mode="single">单选题</button>
        <button data-mode="judge">判断题</button>
        <button data-mode="random">随机练习</button>
        <button data-mode="wrong">错题重练 <span class="badge" id="wrongBadge">0</span></button>
        <button data-mode="topic" id="topicBtn" style="display:none">专题练习</button>
      </div>
      <div class="statsbar">
        <div class="stat"><b id="statDone">0</b><span>已答</span></div>
        <div class="stat ok"><b id="statRight">0</b><span>正确</span></div>
        <div class="stat bad"><b id="statWrong">0</b><span>错误</span></div>
        <div class="stat"><b id="statRate">0%</b><span>正确率</span></div>
      </div>
      <div class="progress"><i id="progressBar"></i></div>
    </div>
    <div class="topbar-mini" id="topbarMini" title="点击展开顶部">
      <span class="mini-icon">⚡</span>
      <span class="mini-mode" id="miniMode">全部练习</span>
      <span class="mini-prog" id="miniProg">第 1 / 234 题</span>
      <span class="mini-rate" id="miniRate">未作答</span>
      <span class="mini-expand">展开 ▼</span>
    </div>
  </div>
  <div class="resume-bar" id="resumeBar">
    <span class="rb-icon">⏯️</span>
    <div class="rb-text" id="resumeText"></div>
    <button class="rb-btn" id="resumeGo">继续</button>
    <button class="rb-close" id="resumeClose" title="关闭">✕</button>
  </div>
  <main id="card" class="card"></main>
  <button type="button" class="sheet-toggle" id="sheetToggle">
    <span>📋 答题卡总览</span><span class="arrow">▼</span>
  </button>
  <div class="answer-sheet" id="answerSheet"><div class="as-grid" id="asGrid"></div></div>
</div>
<div class="navbar">
  <button class="nav-btn" id="prevBtn">← 上一题</button>
  <div class="jump">
    <input id="jumpInput" type="number" min="1" placeholder="题号">
    <button id="jumpBtn">跳转</button>
  </div>
  <button class="nav-btn primary" id="nextBtn">下一题 →</button>
</div>
<div class="toast" id="toast"></div>
<div class="hpanel" id="hpanel">
  <div class="hp-head">
    <button class="hp-back" id="hpBack" style="display:none">←</button>
    <div class="hp-title-wrap"><h2 id="hpTitle">历史记录</h2><p class="sub2" id="hpSub"></p></div>
    <button class="hp-close" id="hpClose">✕</button>
  </div>
  <div class="hp-tabs" id="hpTabs" style="display:none">
    <button id="htWrong" class="active">错题 0</button>
    <button id="htAll">全部 0</button>
  </div>
  <div class="hp-body" id="hlist"></div>
  <div class="hp-foot" id="hpFoot"></div>
</div>

/* ================== 选项打乱 ================== */
function makeShuffledOpts(item){
  if(item.type==='judge') return {o:item.o.slice(),a:item.a,orig:[0,1]};
  var idxs=item.o.map(function(_,i){return i;});
  for(var i=idxs.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=idxs[i];idxs[i]=idxs[j];idxs[j]=t;}
  return {o:idxs.map(function(i){return item.o[i];}),a:idxs.indexOf(item.a),orig:idxs};
}
function getView(item,session){
  if(session&&session.optsMap&&session.optsMap[item.no]) return session.optsMap[item.no];
  return {o:item.o,a:item.a};
}
function ensureOptsForItem(session,item){
  if(session.mode!=='random') return;
  if(!session.optsMap) session.optsMap={};
  if(!session.optsMap[item.no]){session.optsMap[item.no]=makeShuffledOpts(item);saveSessions();}
}

/* ================== 解析文本字母重映射 ================== */
function remapExpText(text,item,session){
  if(!text||!item) return text;
  if(item.type==='judge') return text;
  if(!session||session.mode!=='random') return text;
  if(!session.optsMap||!session.optsMap[item.no]) return text;
  var view=getView(item,session);
  var origIdxToNewLetter={};
  for(var i=0;i<item.o.length;i++){
    var content=item.o[i];
    for(var j=0;j<view.o.length;j++){if(view.o[j]===content){origIdxToNewLetter[i]='ABCD'[j];break;}}
  }
  var result=String(text);
  var placeholders=[];var counter=0;var PH='\u0001PH';
  for(var k=0;k<item.o.length;k++){
    var oL='ABCD'[k];var nL=origIdxToNewLetter[k]||oL;
    if(oL===nL) continue;
    var c=item.o[k];if(!c) continue;
    var full=oL+c;var idx=0;
    while((idx=result.indexOf(full,idx))!==-1){
      var token=PH+(counter++)+'\u0001';
      result=result.substring(0,idx)+token+result.substring(idx+full.length);
      placeholders.push({token:token,replacement:nL+c});
      idx+=token.length;
    }
  }
  for(var k2=0;k2<item.o.length;k2++){
    var oL2='ABCD'[k2];var nL2=origIdxToNewLetter[k2]||oL2;
    if(oL2===nL2) continue;
    var pats=['选项'+oL2,'（'+oL2+'）','【'+oL2+'】','['+oL2+']'];
    for(var p=0;p<pats.length;p++){
      var pat=pats[p];var i2=0;
      while((i2=result.indexOf(pat,i2))!==-1){
        var t2=PH+(counter++)+'\u0001';
        result=result.substring(0,i2)+t2+result.substring(i2+pat.length);
        placeholders.push({token:t2,replacement:pat.split(oL2).join(nL2)});
        i2+=t2.length;
      }
    }
  }
  for(var q=0;q<placeholders.length;q++){var ph=placeholders[q];result=result.split(ph.token).join(ph.replacement);}
  return result;
}

/* ================== 逐选项分析提取 ================== */
function extractOptAnalysis(exp,item){
  if(!exp) return null;
  if(item.type==='judge') return null;
  if(exp.opts&&typeof exp.opts==='object'){
    var explicit={};
    ['A','B','C','D'].forEach(function(L){if(exp.opts[L]) explicit[L]=exp.opts[L];});
    if(Object.keys(explicit).length>0) return explicit;
  }
  var w=exp.w;
  if(!w) return null;
  var result={};
  var matches=[];
  item.o.forEach(function(optText,idx){
    var letter='ABCD'[idx];
    var patterns=[letter+optText,letter+'、',letter+'：',letter+'.','选项'+letter,'（'+letter+'）','【'+letter+'】'];
    for(var p=0;p<patterns.length;p++){
      var pos=w.indexOf(patterns[p]);
      if(pos>=0){matches.push({letter:letter,pos:pos,len:patterns[p].length});break;}
    }
  });
  if(matches.length===0) return null;
  matches.sort(function(a,b){return a.pos-b.pos;});
  var seen={};var uniq=[];
  matches.forEach(function(m){if(!seen[m.letter]){seen[m.letter]=true;uniq.push(m);}});
  uniq.forEach(function(m,i){
    var start=m.pos+m.len;
    var end=(i+1<uniq.length)?uniq[i+1].pos:w.length;
    var text=w.substring(start,end).trim();
    text=text.replace(/^[、，,；;：:\s]+/,'');
    text=text.replace(/[；;。\s]+$/,'');
    if(text) result[m.letter]=text;
  });
  return Object.keys(result).length>0?result:null;
}

const LS_SESSIONS='dg4_sessions_v5';
const LS_THEME='dg4_theme_v1';
const state={mode:'all',queue:[],pos:0,sessions:[],currentId:null,histView:'list',histSessionId:null,histDetailTab:'wrong',topicKeyword:''};

function loadSessions(){
  try{var raw=localStorage.getItem(LS_SESSIONS);if(raw){var d=JSON.parse(raw);state.sessions=Array.isArray(d.sessions)?d.sessions:[];state.currentId=d.currentId||null;}}catch(e){state.sessions=[];state.currentId=null;}
  if(!state.sessions.length) state.currentId=null;
}
function saveSessions(){try{localStorage.setItem(LS_SESSIONS,JSON.stringify({sessions:state.sessions,currentId:state.currentId}));}catch(e){}}

/* ================== 会话 ================== */
function getSession(id){for(var i=0;i<state.sessions.length;i++) if(state.sessions[i].id===id) return state.sessions[i];return null;}
function getCurrentSession(){var s=getSession(state.currentId);if(!s)s=createSession(state.mode);return s;}
function createSession(mode,name){
  var s={id:'s'+Date.now()+'_'+Math.random().toString(36).slice(2,7),name:name||('第'+(state.sessions.length+1)+'次练习'),
    mode:mode,createdAt:Date.now(),updatedAt:Date.now(),answers:{},optsMap:{},
    topicKeyword:mode==='topic'?state.topicKeyword:''};
  state.sessions.push(s);state.currentId=s.id;saveSessions();return s;
}
function sessionForMode(mode){
  for(var i=state.sessions.length-1;i>=0;i--){
    var s=state.sessions[i];
    if(s.mode===mode){
      if(mode!=='topic') return s;
      if(s.topicKeyword===state.topicKeyword) return s;
    }
  }
  return null;
}
function sessionStats(s){
  var total=0,right=0,wrong=0;
  Object.keys(s.answers).forEach(function(no){
    var item=BY_NO[no];if(!item)return;
    var v=getView(item,s);total++;
    if(s.answers[no].c===v.a) right++; else wrong++;
  });
  return {total:total,right:right,wrong:wrong};
}
function computeWrongSet(){
  var last={};
  state.sessions.forEach(function(s){
    Object.keys(s.answers).forEach(function(no){
      var a=s.answers[no];
      if(!last[no]||a.t>last[no].t) last[no]={c:a.c,t:a.t,session:s};
    });
  });
  var set=new Set();
  Object.keys(last).forEach(function(no){
    var item=BY_NO[no];if(!item)return;
    var v=getView(item,last[no].session);
    if(last[no].c!==v.a) set.add(Number(no));
  });
  return set;
}

/* ================== 工具 ================== */
const $=function(id){return document.getElementById(id);};
const card=$('card');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function shuffle(arr){for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}return arr;}
function fmtTime(t){
  var d=new Date(t),p=function(n){return String(n).padStart(2,'0');};
  var now=new Date();
  var sameDay=d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()&&d.getDate()===now.getDate();
  if(sameDay) return '今天 '+p(d.getHours())+':'+p(d.getMinutes());
  return (d.getMonth()+1)+'月'+d.getDate()+'日 '+p(d.getHours())+':'+p(d.getMinutes());
}
function optLabel(item,i,session){var v=getView(item,session);return (item.type==='judge'?'':'ABCD'[i]+'. ')+v.o[i];}

function loadTheme(){try{var v=localStorage.getItem(LS_THEME);if(v==='dark')return true;if(v==='light')return false;}catch(e){}try{return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;}catch(e){return false;}}

/* ================== 队列 ================== */
function buildQueue(mode){
  var all=BANK.map(function(_,i){return i;});
  if(mode==='single') return all.filter(function(i){return BANK[i].type==='single';});
  if(mode==='judge') return all.filter(function(i){return BANK[i].type==='judge';});
  if(mode==='wrong'){var ws=computeWrongSet();return all.filter(function(i){return ws.has(BANK[i].no);});}
  if(mode==='random') return shuffle(all);
  if(mode==='topic'){
    var kw=state.topicKeyword;
    return all.filter(function(i){return BANK[i].exp&&BANK[i].exp.k&&kbKeyword(BANK[i].exp.k)===kw;});
  }
  return all;
}

/* ================== 顶部收起 ================== */
function collapseTopbar(){$('topbar').classList.add('collapsed');updateMiniBar();}
function expandTopbar(){$('topbar').classList.remove('collapsed');}
function updateMiniBar(){

  state.queue.forEach(function(i){var it=BANK[i],rec=sess.answers[it.no];if(rec!==undefined){done++;var v=getView(it,sess);if(rec.c===v.a)right++;}});

}

/* ================== 答题卡 ================== */
function currentItem(){return BANK[state.queue[state.pos]];}

function buildExplainHtml(exp,ok,compact,item,session){
  if(!exp) return '';
  var ansText=exp.a?remapExpText(exp.a,item,session):'';
  var view=getView(item,session);
  var html='<div class="explain '+(ok?'ok':'bad')+'"'+(compact?' style="margin-top:8px"':'')+'>'+
    '<div class="exp-head"><div class="exp-head-icon">'+(ok?'✓':'✗')+'</div><div class="exp-head-title">题目解析</div>'+
    (compact?'':'<div class="exp-head-status">'+(ok?'回答正确':'回答错误')+'</div>')+'</div><div class="exp-body">';
  if(exp.k) html+='<div class="exp-block"><div class="exp-label">知识点</div><p>'+buildKnowledgeHtml(exp.k)+'</p></div>';
  if(ansText) html+='<div class="exp-block"><div class="exp-label">答案解析</div><p>'+esc(ansText)+'</p></div>';
  if(item.type==='single'){
    var optAnalysis=extractOptAnalysis(exp,item);
    if(optAnalysis){
      html+='<div class="exp-block"><div class="exp-label">选项详解</div><div class="exp-options">';
      for(var i=0;i<item.o.length;i++){
        var letter='ABCD'[i];
        var text=view.o[i];
        var isCorrect=(i===view.a);
        var analysisText=optAnalysis[letter];
        if(!analysisText&&isCorrect) analysisText=remapExpText(exp.a||'',item,session)||'这是本题的正确答案。';
        if(!analysisText) analysisText='—';
        analysisText=remapExpText(analysisText,item,session);
        html+='<div class="exp-option '+(isCorrect?'is-right':'is-wrong')+'">'+
              '<span class="opt-tag">'+letter+'</span>'+
              '<div class="opt-content"><div class="opt-text">'+esc(text)+'</div>'+
              '<div class="opt-analysis">'+esc(analysisText)+'</div></div></div>';
      }
      html+='</div></div>';
    } else if(exp.w){
      var wt=remapExpText(exp.w,item,session);
      html+='<div class="exp-block"><div class="exp-label">错项分析</div><div class="exp-options"><div class="exp-option is-wrong"><span class="opt-tag">!</span><span>'+esc(wt)+'</span></div></div></div>';
    }
  }
  html+='</div></div>';
  return html;
}

function render(){
  var sess=getCurrentSession();
  if(state.queue.length===0){
    var tipMsg=state.mode==='wrong'?'错题本是空的，先去全部练习刷题吧':(state.mode==='topic'?'当前知识点下暂无题目':'请切换其他分组');
    card.innerHTML='<div class="empty">🎉 当前分组没有题目<br><span>'+tipMsg+'</span></div>';
    updateStats();updateNav();updateAnswerSheet();return;
  }
  var item=currentItem();
  ensureOptsForItem(sess,item);
  var view=getView(item,sess);
  var rec=sess.answers[item.no];
  var answered=(rec!==undefined);
  var chosen=answered?rec.c:undefined;
  var showShuffled=(state.mode==='random'&&item.type==='single');

  card.innerHTML='<div class="qhead">'+
    '<span class="tag '+(item.type==='judge'?'judge':'')+'">'+(item.type==='single'?'单选题':'判断题')+'</span>'+
    (showShuffled?'<span class="tag shuffled">选项已打乱</span>':'')+
    '<span class="qno">第 '+(state.pos+1)+' / '+state.queue.length+' 题 · No.'+item.no+'</span>'+
    '</div><div class="qtext">'+esc(item.q)+'</div><div class="opts" id="opts"></div><div class="feedback" id="fb"></div>';

  var optsEl=$('opts');
  view.o.forEach(function(text,i){
    var b=document.createElement('button');
    b.type='button';b.className='opt';
    b.innerHTML='<span class="letter">'+'ABCD'[i]+'</span><span>'+esc(text)+'</span>';
    if(answered){b.classList.add('locked');if(i===view.a)b.classList.add('right');else if(i===chosen)b.classList.add('wrong');}
    else b.addEventListener('click',function(){choose(i);});
    optsEl.appendChild(b);
  });

  var fb=$('fb');
  if(answered){
    var ok=(chosen===view.a);
    fb.className='feedback '+(ok?'ok':'bad');
    var html='';
    if(ok) html+='<div class="fb-line"><b>✓ 回答正确</b>　正确答案：'+optLabel(item,view.a,sess)+'</div>';
    else html+='<div class="fb-line"><b>✗ 回答错误</b>　正确答案：'+optLabel(item,view.a,sess)+'　（你选了 '+optLabel(item,chosen,sess)+'）</div>';
    html+=buildExplainHtml(item.exp,ok,false,item,sess);
    fb.innerHTML=html;
  }else{
    fb.className='feedback';
    fb.innerHTML='<span class="hint">点击选项作答 · 键盘 A/B/C/D 或 1-4 也可作答</span>';
  }
  updateStats();updateNav();updateAnswerSheet();
}

function updateStats(){
  var sess=getCurrentSession(),done=0,right=0;
  state.queue.forEach(function(i){var it=BANK[i],rec=sess.answers[it.no];if(rec!==undefined){done++;var v=getView(it,sess);if(rec.c===v.a)right++;}});
  var wrongN=done-right;
  $('statDone').textContent=done;$('statRight').textContent=right;$('statWrong').textContent=wrongN;
  $('statRate').textContent=done?Math.round(right/done*100)+'%':'0%';
  $('progressBar').style.width=(state.queue.length?(done/state.queue.length*100):0)+'%';
  $('wrongBadge').textContent=computeWrongSet().size;
  updateMiniBar();
}
function updateNav(){$('prevBtn').disabled=state.pos<=0;$('nextBtn').disabled=state.pos>=state.queue.length-1;}

function updateAnswerSheet(){
  var grid=$('asGrid');if(!grid) return;
  var sess=getCurrentSession();
  if(state.queue.length===0){grid.innerHTML='<div style="grid-column:1/-1;text-align:center;color:#94a3b8;font-size:13px;padding:8px">暂无题目</div>';return;}
  var html='';
  state.queue.forEach(function(i,idx){
    var it=BANK[i],rec=sess.answers[it.no],cls='as-cell';
    if(rec!==undefined){var v=getView(it,sess);cls+=(rec.c===v.a)?' right':' wrong';}
    if(idx===state.pos) cls+=' current';
    html+='<button type="button" class="'+cls+'" data-idx="'+idx+'">'+(idx+1)+'</button>';
  });
  grid.innerHTML=html;
}

/* ================== 交互 ================== */
function choose(i){
  if(state.queue.length===0) return;
  var item=currentItem(),sess=getCurrentSession();
  if(sess.answers[item.no]!==undefined) return;
  sess.answers[item.no]={c:i,t:Date.now()};sess.updatedAt=Date.now();saveSessions();
  render();
  if($('hpanel').classList.contains('show')) renderHistory();
}
function next(){if(state.pos<state.queue.length-1){state.pos++;render();}}
function prev(){if(state.pos>0){state.pos--;render();}}
function updateModeButtons(){
  Array.prototype.forEach.call(document.querySelectorAll('.modes button'),function(b){b.classList.toggle('active',b.dataset.mode===state.mode);});
}
function switchMode(mode){
  if(mode==='topic'&&!state.topicKeyword){showToast('请先在解析卡中点击知识点标签进入专题');return;}
  state.mode=mode;
  var s=sessionForMode(mode);if(!s) s=createSession(mode);
  state.currentId=s.id;state.queue=buildQueue(mode);
  if(mode==='random'){
    if(!s.optsMap) s.optsMap={};
    state.queue.forEach(function(idx){var it=BANK[idx];if(!s.optsMap[it.no])s.optsMap[it.no]=makeShuffledOpts(it);});
    saveSessions();showToast('🎲 已进入随机练习 · 选项顺序已打乱');
  }
  var idx=0;
  for(var i=0;i<state.queue.length;i++){var no=BANK[state.queue[i]].no;if(s.answers[no]===undefined){idx=i;break;}if(i===state.queue.length-1)idx=i;}
  state.pos=idx;saveSessions();updateModeButtons();render();
}
function enterTopic(kw){
  state.topicKeyword=kw;state.mode='topic';
  var s=sessionForMode('topic');if(!s) s=createSession('topic','专题：'+kw);
  state.currentId=s.id;state.queue=buildQueue('topic');state.pos=0;saveSessions();updateModeButtons();
  $('topicBtn').style.display='';
  $('topicBtn').innerHTML='专题：'+esc(kw)+' <span class="badge">'+state.queue.length+'</span>';
  render();window.scrollTo({top:0,behavior:'smooth'});
  showToast('📚 已进入「'+kw+'」专题，共 '+state.queue.length+' 题');
}

/* ================== 历史 ================== */
function openHistory(){state.histView='list';state.histSessionId=null;renderHistory();$('hpanel').classList.add('show');document.body.style.overflow='hidden';}
function closeHistory(){$('hpanel').classList.remove('show');document.body.style.overflow='';}
function renderHistory(){if(state.histView==='detail') renderSessionDetail(); else renderSessionList();}
function renderSessionList(){
  $('hpBack').style.display='none';$('hpTabs').style.display='none';$('hpTitle').textContent='历史记录';
  var list=state.sessions.filter(function(s){return Object.keys(s.answers).length>0||s.id===state.currentId;}).sort(function(a,b){return b.updatedAt-a.updatedAt;});

function renderSessionDetail(){
  var s=getSession(state.histSessionId);if(!s){state.histView='list';renderHistory();return;}
  var stat=sessionStats(s);
  $('hpBack').style.display='block';$('hpTitle').textContent=s.name;
  $('hpSub').textContent=(MODE_NAMES[s.mode]||s.mode)+' · 正确 '+stat.right+' / 错误 '+stat.wrong+' / 共 '+stat.total+' 题';
  $('hpTabs').style.display='flex';
  $('htWrong').textContent='错题 '+stat.wrong;$('htAll').textContent='全部 '+stat.total;

  else{$('hpFoot').innerHTML='<span class="hint" style="font-size:13px">本次练习没有错题 🎉</span><button class="ghost-sm" id="hpClearAll">清空全部历史</button>';}
  var entries=[];

    var item=BY_NO[no];if(!item)return;

  });

      buildExplainHtml(x.it.exp,x.ok,true,x.it,s)+'</div>';

function reviewSessionWrong(sessionId){
  var s=getSession(sessionId);if(!s)return;
  var wrongNos=[];
  Object.keys(s.answers).forEach(function(no){var item=BY_NO[no];if(!item)return;var v=getView(item,s);if(s.answers[no].c!==v.a) wrongNos.push(Number(no));});
  if(wrongNos.length===0) return;
  var ns=createSession('wrong',s.name+' · 错题重练');state.mode='wrong';
  var idxs=[];wrongNos.forEach(function(no){for(var i=0;i<BANK.length;i++) if(BANK[i].no===no){idxs.push(i);break;}});
  state.queue=idxs;state.pos=0;state.currentId=ns.id;saveSessions();closeHistory();updateModeButtons();render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function startRename(el){
  var id=el.dataset.id;var s=getSession(id);if(!s)return;
  var input=document.createElement('input');input.type='text';input.className='hname-input';input.value=s.name;input.maxLength=30;
  el.replaceWith(input);input.focus();input.select();
  var done=false;
  function commit(){if(done)return;done=true;var v=input.value.trim();if(v)s.name=v;saveSessions();renderHistory();}
  input.addEventListener('blur',commit);
  input.addEventListener('keydown',function(ev){if(ev.key==='Enter'){ev.preventDefault();input.blur();}else if(ev.key==='Escape'){input.value=s.name;input.blur();}ev.stopPropagation();});
}

/* ================== 继续上次练习 ================== */
function checkResume(){
  var sess=getCurrentSession();
  if(sess&&state.queue&&state.queue.length){
    var un=0;
    state.queue.forEach(function(i){if(sess.answers[BANK[i].no]===undefined) un++;});
    if(un>0&&un<state.queue.length){
      $('resumeText').innerHTML='上次「<b>'+esc(sess.name)+'</b>」还剩 <b>'+un+'</b> 题未答，是否继续？';
      $('resumeBar').classList.add('show');
      $('resumeBar').dataset.sid='';
      return;
    }
  }
  var list=state.sessions.filter(function(s){
    if(!s.answers) return false;
    if(s.id===state.currentId) return false;
    var total=Object.keys(s.answers).length;
    if(total===0) return false;
    var qlen=0;
    if(s.mode==='all') qlen=BANK.length;
    else if(s.mode==='single') qlen=BANK.filter(function(it){return it.type==='single';}).length;
    else if(s.mode==='judge') qlen=BANK.filter(function(it){return it.type==='judge';}).length;
    else if(s.mode==='random') qlen=BANK.length;
    else if(s.mode==='wrong') qlen=-1;
    else if(s.mode==='topic') qlen=BANK.filter(function(it){return it.exp&&it.exp.k&&kbKeyword(it.exp.k)===s.topicKeyword;}).length;
    if(qlen>0&&total<qlen) return true;
    return false;
  }).sort(function(a,b){return b.updatedAt-a.updatedAt;});
  if(list.length===0) return;
  var s=list[0];
  $('resumeText').innerHTML='上次「<b>'+esc(s.name)+'</b>」尚未完成，是否继续？';
  $('resumeBar').classList.add('show');
  $('resumeBar').dataset.sid=s.id;
}
function hideResume(){$('resumeBar').classList.remove('show');$('resumeBar').dataset.sid='';}

/* ================== 跳转 ================== */
function jumpTo(input){
  var v=parseInt(input,10);if(isNaN(v))return false;
  var idx=-1;
  for(var i=0;i<state.queue.length;i++){if(BANK[state.queue[i]].no===v){idx=i;break;}}
  if(idx>=0){state.pos=idx;render();return true;}
  if(v>=1&&v<=state.queue.length){state.pos=v-1;render();return true;}
  return false;
}

/* ================== 事件绑定 ================== */
$('modes').addEventListener('click',function(e){var btn=e.target.closest('button[data-mode]');if(btn) switchMode(btn.dataset.mode);});
$('prevBtn').addEventListener('click',prev);
$('nextBtn').addEventListener('click',next);
$('jumpBtn').addEventListener('click',function(){if(jumpTo($('jumpInput').value))$('jumpInput').value='';});
$('jumpInput').addEventListener('keydown',function(e){if(e.key==='Enter'){if(jumpTo($('jumpInput').value))$('jumpInput').value='';}});
$('collapseBtn').addEventListener('click',function(e){e.stopPropagation();collapseTopbar();});
$('topbarMini').addEventListener('click',function(){expandTopbar();});
$('themeBtn').addEventListener('click',function(e){e.stopPropagation();toggleTheme();});

$('sheetToggle').addEventListener('click',function(){this.classList.toggle('open');$('answerSheet').classList.toggle('open');if($('answerSheet').classList.contains('open')) updateAnswerSheet();});
$('asGrid').addEventListener('click',function(e){
  var cell=e.target.closest('.as-cell');if(!cell) return;
  var idx=parseInt(cell.dataset.idx,10);
  if(!isNaN(idx)&&idx>=0&&idx<state.queue.length){state.pos=idx;render();window.scrollTo({top:0,behavior:'smooth'});}
});

$('resumeGo').addEventListener('click',function(){
  var sid=$('resumeBar').dataset.sid;
  if(sid){
    var s=getSession(sid);if(!s){hideResume();return;}
    state.mode=s.mode;
    if(s.mode==='topic') state.topicKeyword=s.topicKeyword||'';
    state.currentId=s.id;state.queue=buildQueue(s.mode);
    if(s.mode==='random'){if(!s.optsMap) s.optsMap={};state.queue.forEach(function(idx){var it=BANK[idx];if(!s.optsMap[it.no])s.optsMap[it.no]=makeShuffledOpts(it);});}
    var p=0;
    for(var i=0;i<state.queue.length;i++){if(s.answers[BANK[state.queue[i]].no]===undefined){p=i;break;}}
    state.pos=p;saveSessions();updateModeButtons();
    if(s.mode==='topic'){$('topicBtn').style.display='';$('topicBtn').innerHTML='专题：'+esc(s.topicKeyword||'')+' <span class="badge">'+state.queue.length+'</span>';}
  }else{
    var sess=getCurrentSession();var p=state.pos;
    for(var i=0;i<state.queue.length;i++){if(sess.answers[BANK[state.queue[i]].no]===undefined){p=i;break;}}
    state.pos=p;
  }
  hideResume();render();window.scrollTo({top:0,behavior:'smooth'});
});
$('resumeClose').addEventListener('click',hideResume);

card.addEventListener('click',function(e){
  var chip=e.target.closest('.k-chip');
  if(chip){e.preventDefault();var kw=chip.dataset.kw;if(kw) enterTopic(kw);}
});

$('redoBtn').addEventListener('click',function(){
  var cur=getCurrentSession();var n=Object.keys(cur.answers).length;
  if(n>0&&!confirm('开始一次新的练习？当前进度会保存到「历史记录」。')) return;
  var ns=createSession(state.mode);state.queue=buildQueue(state.mode);
  if(state.mode==='random'){state.queue.forEach(function(idx){var it=BANK[idx];if(!ns.optsMap[it.no])ns.optsMap[it.no]=makeShuffledOpts(it);});}
  state.pos=0;saveSessions();render();
});

$('clearBtn').addEventListener('click',function(){
  if(confirm('确定要清空全部练习记录吗？此操作不可恢复。')){
    state.sessions=[];state.currentId=null;saveSessions();
    var ns=createSession(state.mode);state.queue=buildQueue(state.mode);
    if(state.mode==='random'){state.queue.forEach(function(idx){var it=BANK[idx];if(!ns.optsMap[it.no])ns.optsMap[it.no]=makeShuffledOpts(it);});}
    state.pos=0;saveSessions();render();
    if($('hpanel').classList.contains('show')){state.histView='list';state.histSessionId=null;renderHistory();}
  }
});

$('histBtn').addEventListener('click',openHistory);
$('hpClose').addEventListener('click',closeHistory);
$('hpBack').addEventListener('click',function(){state.histView='list';state.histSessionId=null;renderHistory();});
$('htWrong').addEventListener('click',function(){state.histDetailTab='wrong';renderSessionDetail();});
$('htAll').addEventListener('click',function(){state.histDetailTab='all';renderSessionDetail();});

$('hlist').addEventListener('click',function(e){
  var delBtn=e.target.closest('.sc-del');
  if(delBtn){
    e.preventDefault();e.stopPropagation();
    var sid=delBtn.dataset.del;var s=getSession(sid);if(!s) return;
    if(!confirm('确定要删除「'+s.name+'」这条练习记录吗？')) return;
    state.sessions=state.sessions.filter(function(x){return x.id!==sid;});
    if(state.currentId===sid){
      state.currentId=null;
      var ns=createSession(state.mode);state.queue=buildQueue(state.mode);state.pos=0;render();
    }
    saveSessions();renderHistory();return;
  }
  var nameEl=e.target.closest('.hname');
  if(nameEl){e.preventDefault();e.stopPropagation();startRename(nameEl);return;}
  var cardEl=e.target.closest('.session-card');
  if(cardEl){state.histView='detail';state.histSessionId=cardEl.dataset.id;state.histDetailTab='wrong';renderHistory();$('hlist').scrollTop=0;return;}
});

$('hpFoot').addEventListener('click',function(e){
  if(e.target.closest('#hpReview')){reviewSessionWrong(state.histSessionId);return;}
  if(e.target.closest('#hpClearAll')){
    if(confirm('确定要清空全部练习记录吗？此操作不可恢复。')){
      state.sessions=[];state.currentId=null;
      var ns=createSession(state.mode);state.queue=buildQueue(state.mode);state.pos=0;saveSessions();
      state.histView='list';state.histSessionId=null;renderHistory();render();
    }
  }
});

document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&$('hpanel').classList.contains('show')){
    if(state.histView==='detail'){state.histView='list';state.histSessionId=null;renderHistory();}
    else closeHistory();
    return;
  }
  if(e.target.tagName==='INPUT') return;
  if(state.queue.length===0) return;
  if($('hpanel').classList.contains('show')) return;
  var item=currentItem();
  var k=e.key.toUpperCase();
  if(k.length===1&&'ABCD'.indexOf(k)>=0){var i1='ABCD'.indexOf(k);if(i1<item.o.length){choose(i1);e.preventDefault();}}
  else if(k.length===1&&'1234'.indexOf(k)>=0){var i2=parseInt(k,10)-1;if(i2<item.o.length){choose(i2);e.preventDefault();}}
  else if(e.key==='ArrowRight') next();
  else if(e.key==='ArrowLeft') prev();
});

(function(){
  var startX=0,startY=0,touching=false;
  card.addEventListener('touchstart',function(e){if(e.touches.length!==1) return;startX=e.touches[0].clientX;startY=e.touches[0].clientY;touching=true;},{passive:true});
  card.addEventListener('touchend',function(e){
    if(!touching) return;touching=false;
    if(!e.changedTouches.length) return;
    var dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.2){if(dx<0) next(); else prev();}
  },{passive:true});
})();

/* ================== 启动 ================== */
loadSessions();
applyTheme(loadTheme());
switchMode('all');
setTimeout(checkResume,400);
</script>
</body>
</html>
